function renderCastIndex(){
  currentView = { type:'cast' };

function renderCodexIndex(){
  currentView = { type:'codex' };
  const cats = {};
  BOOK.codex_index.forEach(r => {
    cats[r.category] = cats[r.category] || [];
    cats[r.category].push(r);
  });
  let html = `<div class="rules-page"><h2 class="page-title">📜 Codex &amp; Lore Index</h2><p class="page-sub">Every term from the Lexicon &amp; World-Building tables, synthesized across ${getTotalChapters()} chapters.</p>`;
  Object.entries(cats).forEach(([category, entries]) => {
    html += `<div class="stage-group"><h3>${category}</h3>`;
    entries.forEach(r => {
      html += `
        <div class="rule-card" data-chapter="${r.chapter}">
          <div class="rule-num">${String(r.num).padStart(2,'0')}</div>
          <div>
            <p class="rule-title">${r.title}</p>
            <p class="rule-desc">${r.desc}</p>
            <span class="rule-src">from Chapter ${r.chapter} →</span>
          </div>
        </div>`;
    });
    html += `</div>`;
  });
  html += `</div>`;
  mainEl.innerHTML = html;
  document.querySelectorAll('.rule-card').forEach(el => {
    el.addEventListener('click', () => renderChapter(Number(el.dataset.chapter)));
  });
  highlightTOC();
  window.scrollTo(0,0);
}

function renderCharacterGraph() {
  const modal = document.getElementById('modal-overlay');
  const content = document.getElementById('modal-content');
  // Build co-occurrence graph
  const chars = {};
  BOOK.chapters.forEach(ch => {
    (ch.characters||[]).forEach(c => chars[c] = (chars[c]||0)+1);
  });
  const topChars = Object.keys(chars).sort((a,b)=>chars[b]-chars[a]).slice(0,12);
  let graph = 'graph TD\n';
  topChars.forEach(c => graph += `  ${c.replace(/[^a-zA-Z]/g,'_')}["${c}"]\n`);
  // Add edges based on co-occurrence in chapters
  const pairs = {};
  BOOK.chapters.forEach(ch => {
    const present = (ch.characters||[]).filter(c => topChars.includes(c));
    for(let i=0; i<present.length; i++) {
      for(let j=i+1; j<present.length; j++) {
        const key = [present[i], present[j]].sort().join('--');
        pairs[key] = (pairs[key]||0)+1;
      }
    }
  });
  Object.entries(pairs).filter(([k,v])=>v>1).sort((a,b)=>b[1]-a[1]).slice(0,20).forEach(([key, val]) => {
    const [a,b] = key.split('--');
    if(a && b) graph += `  ${a.replace(/[^a-zA-Z]/g,'_')} --- ${b.replace(/[^a-zA-Z]/g,'_')}\n`;
  });

  content.innerHTML = `<div class="mermaid" style="min-height:300px;">${graph}</div>`;
  modal.classList.add('active');
  setTimeout(() => mermaid.run({ querySelector: '.mermaid' }), 100);
}

function exportMarkdown() {
  const ch = currentView.type === 'chapter' ? BOOK.chapters.find(c => c.chapter === currentView.chapter) : null;
  if (!ch) { showToast('Please open a chapter first.'); return; }
  // Strip HTML tags for a clean markdown export
  const tmp = document.createElement('div');
  tmp.innerHTML = ch.html;
  const text = tmp.textContent || tmp.innerText || '';
  const lines = text.split('\n').filter(l => l.trim().length > 0).slice(0, 40).join('\n');
  const markdown = `# ${ch.title}\n\n> ${ch.summary || ''}\n\n## Key Excerpts\n\n${lines}\n\n---\n*Exported from The Dragonbone Chair Reading Archive*`;
  navigator.clipboard.writeText(markdown).then(() => {
    showToast('📤 Chapter notes copied as Markdown!');
  }).catch(() => {
    // Fallback
    const area = document.createElement('textarea');
    area.value = markdown;
    document.body.appendChild(area);
    area.select();
    document.execCommand('copy');
    area.remove();
    showToast('📤 Chapter notes copied!');
  });
}

  chapter: ch.chapter,
  hay: (ch.title + ' ' + (ch.tags||[]).join(' ') + ' ' + (ch.characters||[]).join(' ') + ' ' + (ch.themes||[]).join(' ') + ' ' + (ch.locations||[]).join(' ') + ' ' + ch.html.replace(/<[^>]+>/g,' ')).toLowerCase()
}));
const searchInput = document.getElementById('search');
const hitsEl = document.getElementById('hits');
searchInput.addEventListener('input', () => {
  const q = searchInput.value.trim().toLowerCase();
  if(!q){
    document.querySelectorAll('.toc li').forEach(li => li.style.display = '');
    hitsEl.textContent = '';
    return;
  }
  let count = 0;
  document.querySelectorAll('.toc li').forEach((li, i) => {
    const match = searchIndex[i].hay.includes(q);
    li.style.display = match ? '' : 'none';
    if(match) count++;
  });
  hitsEl.textContent = `${count} chapter${count===1?'':'s'} match`;
});
