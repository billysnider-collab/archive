<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reading Archive — The Dragonbone Chair</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/mermaid/10.9.1/mermaid.min.js"></script>
<style>
  :root{
    --paper:#eae3d2;
    --paper-2:#e2d9c4;
    --card:#f4efe2;
    --ink:#2a2622;
    --ink-soft:#5b5347;
    --rule:#c9bd9e;
    --oxblood:#7c2e2a;
    --oxblood-dim:#a8564f;
    --green:#3a4a3a;
    --gold:#a3792f;
    --shadow: 0 1px 0 rgba(42,38,34,.06);
    --radius: 3px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    background-image:
      radial-gradient(rgba(42,38,34,0.035) 1px, transparent 1px);
    background-size: 3px 3px;
    color:var(--ink);
    font-family:'Source Serif 4', Georgia, serif;
    font-size:16.5px;
    line-height:1.65;
  }
  a{color:inherit;}
  ::selection{background:var(--oxblood); color:var(--card);}

  .layout{
    display:grid;
    grid-template-columns: 300px 1fr;
    min-height:100vh;
  }

  /* ---------- SIDEBAR : catalog drawer ---------- */
  .sidebar{
    background:var(--paper-2);
    border-right:1px solid var(--rule);
    padding: 28px 22px 40px;
    position:sticky; top:0; height:100vh; overflow-y:auto;
  }
  .brand{
    margin-bottom:22px;
    padding-bottom:18px;
    border-bottom: 2px solid var(--ink);
  }
  .brand .kicker{
    font-family:'IBM Plex Mono', monospace;
    font-size:10.5px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--oxblood);
    margin:0 0 6px;
  }
  .brand h1{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:23px;
    line-height:1.15;
    margin:0 0 6px;
  }
  .brand .authors{
    font-size:13px;
    color:var(--ink-soft);
    font-style:italic;
  }

  .search-wrap{ margin-bottom: 20px; }
  #search{
    width:100%;
    padding:9px 11px;
    font-family:'IBM Plex Mono', monospace;
    font-size:12.5px;
    background:var(--card);
    border:1px solid var(--rule);
    border-radius:var(--radius);
    color:var(--ink);
  }
  #search:focus{outline:2px solid var(--oxblood-dim); outline-offset:1px;}

  .nav-section-label{
    font-family:'IBM Plex Mono', monospace;
    font-size:10px;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin: 20px 0 8px;
  }

  .toc{list-style:none; margin:0; padding:0;}
  .toc li{ margin-bottom:2px; }
  .toc button{
    all:unset;
    display:flex;
    align-items:baseline;
    gap:10px;
    width:100%;
    padding:8px 10px;
    cursor:pointer;
    border-radius:var(--radius);
    font-size:14.5px;
  }
  .toc button:hover{ background:rgba(42,38,34,.06); }
  .toc button.active{
    background:var(--card);
    box-shadow: inset 3px 0 0 var(--oxblood);
  }
  .toc .num{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    color:var(--oxblood);
    min-width:20px;
  }
  .toc .t{ color:var(--ink); }
  .toc button.active .t{ font-weight:600; }

  .rules-link{
    display:block;
    margin-top:22px;
    padding:10px 12px;
    background:var(--green);
    color:var(--card);
    text-align:center;
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:.06em;
    text-transform:uppercase;
    border-radius:var(--radius);
    cursor:pointer;
    border:none;
  }
  .rules-link:hover{ background:#2c392c; }
  #cast-btn:hover{ background:var(--oxblood-dim) !important; }
  .toc button.active .progress-dot{ opacity:1; }

  /* ---------- MAIN ---------- */
  main{ padding: 48px 56px 100px; max-width: 820px; }

  .card-header{
    border:1px solid var(--rule);
    background:var(--card);
    border-radius:var(--radius);
    padding: 22px 26px;
    margin-bottom: 34px;
    box-shadow: var(--shadow);
    position:relative;
  }
  .card-header::before{
    content:"";
    position:absolute; left:0; top:14px; bottom:14px; width:4px;
    background:var(--oxblood);
  }
  .card-header .meta-row{
    display:flex; flex-wrap:wrap; gap:8px 18px;
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    color:var(--ink-soft);
    text-transform:uppercase;
    letter-spacing:.05em;
    margin-bottom:10px;
  }
  .card-header h2{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:30px;
    margin:0 0 10px;
    line-height:1.2;
  }
  .card-header .summary{
    color:var(--ink-soft);
    font-size:15px;
    font-style:italic;
    margin:0;
  }
  .tag-row{ margin-top:14px; display:flex; flex-wrap:wrap; gap:6px; }
  .tag{
    font-family:'IBM Plex Mono', monospace;
    font-size:10px;
    padding:3px 8px;
    border:1px solid var(--rule);
    border-radius:20px;
    color:var(--ink-soft);
  }
  .rating{
    font-family:'IBM Plex Mono', monospace;
    color:var(--gold);
  }

  article h1{ display:none; } /* chapter already h1'd in card-header */
  article h2{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:22px;
    margin: 40px 0 14px;
    padding-bottom:8px;
    border-bottom: 1px solid var(--rule);
  }
  article h3{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:18px;
    margin: 28px 0 10px;
    color: var(--oxblood);
  }
  article h4{ font-size:15px; margin:20px 0 8px; font-weight:600;}
  article p{ margin: 0 0 14px; }
  article ul, article ol{ margin: 0 0 16px; padding-left: 22px; }
  article li{ margin-bottom:6px; }
  article strong{ color:var(--ink); }
  article hr{ border:none; border-top:1px solid var(--rule); margin:32px 0; }
  article blockquote{
    margin: 20px 0;
    padding: 4px 20px;
    border-left: 3px solid var(--gold);
    font-style: italic;
    color: var(--ink-soft);
  }
  article code{
    font-family:'IBM Plex Mono', monospace;
    font-size:.9em;
    background: rgba(42,38,34,.07);
    padding: 1px 5px;
    border-radius:3px;
  }
  article table{
    width:100%;
    border-collapse:collapse;
    margin: 18px 0 24px;
    font-size:14.5px;
    background:var(--card);
  }
  article th, article td{
    border:1px solid var(--rule);
    padding:8px 10px;
    text-align:left;
    vertical-align:top;
  }
  article th{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.04em;
    background: var(--paper-2);
  }
  .wikilink{
    color: var(--oxblood);
    border-bottom: 1px dotted var(--oxblood-dim);
    font-style: normal;
  }
  .mermaid{
    background: var(--card);
    border:1px solid var(--rule);
    border-radius: var(--radius);
    padding: 18px;
    margin: 20px 0;
    display:flex; justify-content:center; overflow-x:auto;
  }

  /* Callouts — marginalia notes */
  .callout{
    border:1px solid var(--rule);
    border-left: 4px solid var(--ink-soft);
    background: var(--card);
    border-radius: var(--radius);
    padding: 14px 18px;
    margin: 18px 0;
  }
  .callout-title{
    margin:0 0 6px;
    font-family:'IBM Plex Mono', monospace;
    font-size:11.5px;
    text-transform:uppercase;
    letter-spacing:.05em;
    font-weight:600;
  }
  .callout-body p:last-child{ margin-bottom:0; }
  .callout-tip{ border-left-color: var(--green); }
  .callout-tip .callout-title{ color: var(--green); }
  .callout-success{ border-left-color: #4c6b3f; }
  .callout-success .callout-title{ color:#4c6b3f; }
  .callout-warning{ border-left-color: var(--gold); }
  .callout-warning .callout-title{ color: var(--gold); }
  .callout-danger{ border-left-color: var(--oxblood); }
  .callout-danger .callout-title{ color: var(--oxblood); }
  .callout-important{ border-left-color: var(--oxblood); }
  .callout-important .callout-title{ color: var(--oxblood); }
  .callout-abstract{ border-left-color: var(--ink); }
  .callout-quote{ border-left-color: var(--ink-soft); font-style:italic; }
  .callout-question{ border-left-color: var(--oxblood-dim); }
  .callout-example{ border-left-color: var(--gold); }
  .callout-note{ border-left-color: var(--ink-soft); }
  .callout-check{ border-left-color: #4c6b3f; }

  .chapter-nav{
    display:flex; justify-content:space-between; gap:16px;
    margin-top: 48px; padding-top:20px; border-top:1px solid var(--rule);
  }
  .chapter-nav a{
    text-decoration:none;
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:.04em;
    color:var(--ink-soft);
    padding:10px 14px;
    border:1px solid var(--rule);
    border-radius:var(--radius);
    cursor:pointer;
    background:var(--card);
  }
  .chapter-nav a:hover{ border-color:var(--oxblood); color:var(--oxblood); }
  .chapter-nav .spacer{ flex:1; }

  /* Rules index page */
  .rules-page h2.page-title{
    font-family:'Fraunces', serif; font-size:30px; font-weight:600; margin:0 0 6px;
  }
  .rules-page .page-sub{ color:var(--ink-soft); font-style:italic; margin-bottom:30px;}
  .stage-group{ margin-bottom:30px; }
  .stage-group h3{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px; text-transform:uppercase; letter-spacing:.08em;
    color:var(--oxblood); border-bottom:1px solid var(--rule); padding-bottom:8px; margin-bottom:14px;
  }
  .rule-card{
    display:flex; gap:16px;
    padding:14px 4px;
    border-bottom:1px dashed var(--rule);
    cursor:pointer;
  }
  .rule-card:hover .rule-title{ color:var(--oxblood); }
  .rule-num{
    font-family:'Fraunces', serif; font-weight:600; font-size:26px;
    color:var(--rule); min-width:38px;
  }
  .rule-title{ font-weight:600; margin:0 0 4px; font-size:16px; }
  .rule-desc{ color:var(--ink-soft); font-size:14.5px; margin:0; }
  .rule-src{ font-family:'IBM Plex Mono', monospace; font-size:10.5px; color:var(--ink-soft); margin-top:6px; display:inline-block;}

  #hits{ font-family:'IBM Plex Mono', monospace; font-size:10.5px; color:var(--ink-soft); margin-top:6px; min-height:14px;}

  @media (max-width: 860px){
    .layout{ grid-template-columns: 1fr; }
    .sidebar{ position:relative; height:auto; border-right:none; border-bottom:1px solid var(--rule); }
    main{ padding: 28px 20px 80px; }
  }
</style>
</head>
<body>

<div class="layout">
  <nav class="sidebar">
    <div class="brand">
      <p class="kicker"><a href="index.html" style="color:var(--oxblood);">← Reading Archive</a></p>
      <h1 id="book-title"></h1>
      <p class="authors" id="book-authors"></p>
      <p id="progress-line" style="font-family:'IBM Plex Mono', monospace; font-size:10.5px; color:var(--ink-soft); margin:10px 0 0;"></p>
    </div>

    <div class="search-wrap">
      <input id="search" type="text" placeholder="search chapters, tags, text…" autocomplete="off">
      <div id="hits"></div>
    </div>

    <p class="nav-section-label">Chapters</p>
    <ul class="toc" id="toc"></ul>

    <button class="rules-link" id="codex-btn">📜 Codex &amp; Lore Index</button>
    <button class="rules-link" id="cast-btn" style="background:var(--oxblood); margin-top:8px;">🎭 Cast Index</button>
  </nav>

  <main id="main"></main>
</div>


<script src="dragonbone-chair-data/ch01.js"></script>
<script src="dragonbone-chair-data/ch02.js"></script>
<script src="dragonbone-chair-data/ch03.js"></script>
<script src="dragonbone-chair-data/ch04.js"></script>
<script src="dragonbone-chair-data/ch05.js"></script>
<script src="dragonbone-chair-data/codex.js"></script>
<script>
mermaid.initialize({ startOnLoad: false, theme: 'neutral' });

const BOOK = {"title": "The Dragonbone Chair", "authors": "Tad Williams", "series": "Memory, Sorrow, and Thorn \u2014 Vol. 1", "chapters": window.BOOK_CHAPTERS || [], "codex_index": window.BOOK_CODEX || []};

const mainEl = document.getElementById('main');
const tocEl = document.getElementById('toc');
document.getElementById('book-title').textContent = BOOK.title;
document.getElementById('book-authors').textContent = BOOK.authors + (BOOK.series ? ' · ' + BOOK.series : '');

let currentView = { type: 'chapter', chapter: BOOK.chapters[0].chapter };

function buildTOC(){
  tocEl.innerHTML = '';
  BOOK.chapters.forEach(ch => {
    const li = document.createElement('li');
    const btn = document.createElement('button');
    btn.innerHTML = `<span class="num">${String(ch.chapter).padStart(2,'0')}</span><span class="t">${ch.title.replace(/^Chapter\s*\d+:\s*/i,'')}</span>`;
    btn.dataset.chapter = ch.chapter;
    btn.addEventListener('click', () => renderChapter(ch.chapter));
    li.appendChild(btn);
    tocEl.appendChild(li);
  });
}

function highlightTOC(){
  document.querySelectorAll('.toc button').forEach(b => {
    b.classList.toggle('active', currentView.type==='chapter' && Number(b.dataset.chapter) === currentView.chapter);
  });
}

function starRating(r){
  if(!r) return '';
  const n = Math.round(parseFloat(r)/2);
  return '★'.repeat(n) + '☆'.repeat(5-n) + ` <span style="color:var(--ink-soft)">(${r}/10)</span>`;
}

function renderChapter(num){
  const ch = BOOK.chapters.find(c => c.chapter === num);
  if(!ch) return;
  currentView = { type:'chapter', chapter:num };
  const idx = BOOK.chapters.indexOf(ch);
  const prev = BOOK.chapters[idx-1];
  const next = BOOK.chapters[idx+1];

  mainEl.innerHTML = `
    <div class="card-header">
      <div class="meta-row">
        <span>Chapter ${ch.chapter}</span>
        <span>·</span>
        <span>pp. ${ch.pages}</span>
        ${ch.rating ? `<span>·</span><span class="rating">${starRating(ch.rating)}</span>` : ''}
      </div>
      <h2>${ch.title}</h2>
      ${ch.summary ? `<p class="summary">${ch.summary}</p>` : ''}
      ${ch.tags && ch.tags.length ? `<div class="tag-row">${ch.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div>` : ''}
    </div>
    <article>${ch.html}</article>
    <div class="chapter-nav">
      ${prev ? `<a id="nav-prev">← Ch ${prev.chapter}</a>` : '<span></span>'}
      <span class="spacer"></span>
      ${next ? `<a id="nav-next">Ch ${next.chapter} →</a>` : '<span></span>'}
    </div>
  `;
  if(prev) document.getElementById('nav-prev').addEventListener('click', ()=>renderChapter(prev.chapter));
  if(next) document.getElementById('nav-next').addEventListener('click', ()=>renderChapter(next.chapter));

  highlightTOC();
  window.scrollTo(0,0);
  mermaid.run({ querySelector: '.mermaid' });

  try{ localStorage.setItem('dbc-last-chapter', String(num)); }catch(e){}
  updateProgress();
}

function updateProgress(){
  const el = document.getElementById('progress-line');
  if(!el) return;
  el.textContent = `${BOOK.chapters.length} chapter${BOOK.chapters.length===1?'':'s'} logged so far`;
}

function renderCastIndex(){
  currentView = { type:'cast' };
  const cast = {};
  BOOK.chapters.forEach(ch => {
    (ch.characters||[]).forEach(name => {
      cast[name] = cast[name] || [];
      cast[name].push(ch.chapter);
    });
  });
  const names = Object.keys(cast).sort();
  let html = `
    <div class="rules-page">
      <h2 class="page-title">Cast Index</h2>
      <p class="page-sub">Every character logged across ${BOOK.chapters.length} chapter${BOOK.chapters.length===1?'':'s'} so far, and where they show up.</p>
      <div class="stage-group">
  `;
  names.forEach(name => {
    const chapters = cast[name];
    html += `
      <div class="rule-card" data-chapter="${chapters[0]}">
        <div class="rule-num" style="font-size:15px; color:var(--oxblood);">${chapters.length}×</div>
        <div>
          <p class="rule-title">${name}</p>
          <p class="rule-desc">Appears in ${chapters.map(c=>`Ch. ${c}`).join(', ')}</p>
          <span class="rule-src">jump to first appearance →</span>
        </div>
      </div>`;
  });
  html += `</div></div>`;
  mainEl.innerHTML = html;
  document.querySelectorAll('.rule-card').forEach(el => {
    el.addEventListener('click', () => renderChapter(Number(el.dataset.chapter)));
  });
  highlightTOC();
  window.scrollTo(0,0);
}

function renderCodexIndex(){
  currentView = { type:'codex' };
  const cats = {};
  BOOK.codex_index.forEach(r => {
    cats[r.category] = cats[r.category] || [];
    cats[r.category].push(r);
  });
  let html = `
    <div class="rules-page">
      <h2 class="page-title">Codex &amp; Lore Index</h2>
      <p class="page-sub">Every term from the Lexicon &amp; World-Building tables, synthesized across all ${BOOK.chapters.length} chapters logged so far — grouped by category, in order of first appearance.</p>
  `;
  Object.entries(cats).forEach(([category, entries]) => {
    html += `<div class="stage-group"><h3>${category}</h3>`;
    entries.forEach(r => {
      html += `
        <div class="rule-card" data-chapter="${r.chapter}">
          <div class="rule-num">${String(r.num).padStart(2,'0')}</div>
          <div>
            <p class="rule-title">${r.title}</p>
            <p class="rule-desc">${r.desc}</p>
            <span class="rule-src">from Chapter ${r.chapter} →</span>
          </div>
        </div>`;
    });
    html += `</div>`;
  });
  html += `</div>`;
  mainEl.innerHTML = html;
  document.querySelectorAll('.rule-card').forEach(el => {
    el.addEventListener('click', () => renderChapter(Number(el.dataset.chapter)));
  });
  highlightTOC();
  window.scrollTo(0,0);
}

document.getElementById('codex-btn').addEventListener('click', renderCodexIndex);
document.getElementById('cast-btn').addEventListener('click', renderCastIndex);

// --- simple search across titles, tags, and stripped chapter text ---
const searchIndex = BOOK.chapters.map(ch => ({
  chapter: ch.chapter,
  title: ch.title,
  hay: (ch.title + ' ' + (ch.tags||[]).join(' ') + ' ' + (ch.characters||[]).join(' ') + ' ' + ch.html.replace(/<[^>]+>/g,' ')).toLowerCase()
}));

const searchInput = document.getElementById('search');
const hitsEl = document.getElementById('hits');
searchInput.addEventListener('input', () => {
  const q = searchInput.value.trim().toLowerCase();
  if(!q){
    document.querySelectorAll('.toc li').forEach(li => li.style.display = '');
    hitsEl.textContent = '';
    return;
  }
  let count = 0;
  document.querySelectorAll('.toc li').forEach((li, i) => {
    const match = searchIndex[i].hay.includes(q);
    li.style.display = match ? '' : 'none';
    if(match) count++;
  });
  hitsEl.textContent = `${count} chapter${count===1?'':'s'} match`;
});

buildTOC();
updateProgress();

let startChapter = BOOK.chapters[0].chapter;
try{
  const saved = localStorage.getItem('dbc-last-chapter');
  if(saved && BOOK.chapters.some(c => c.chapter === Number(saved))){
    startChapter = Number(saved);
  }
}catch(e){}
renderChapter(startChapter);
</script>

</body>
</html>
