<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Archive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#eae3d2;
    --paper-2:#e2d9c4;
    --card:#f4efe2;
    --ink:#2a2622;
    --ink-soft:#5b5347;
    --rule:#c9bd9e;
    --oxblood:#7c2e2a;
    --oxblood-dim:#a8564f;
    --green:#3a4a3a;
    --gold:#a3792f;
    --radius:3px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    background-image: radial-gradient(rgba(42,38,34,0.035) 1px, transparent 1px);
    background-size: 3px 3px;
    color:var(--ink);
    font-family:'Source Serif 4', Georgia, serif;
    line-height:1.6;
  }
  a{color:inherit; text-decoration:none;}
  ::selection{background:var(--oxblood); color:var(--card);}

  header{
    max-width: 900px;
    margin: 0 auto;
    padding: 64px 28px 28px;
    border-bottom: 2px solid var(--ink);
  }
  .kicker{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:.16em;
    text-transform:uppercase;
    color:var(--oxblood);
    margin:0 0 10px;
  }
  h1{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:44px;
    margin:0 0 12px;
    letter-spacing:-.01em;
  }
  .lede{
    color:var(--ink-soft);
    font-style:italic;
    font-size:16.5px;
    max-width:58ch;
    margin:0 0 8px;
    line-height:1.5;
  }
  .count{
    font-family:'IBM Plex Mono', monospace;
    font-size:11.5px;
    color:var(--ink-soft);
    margin-top:16px;
  }

  .controls{
    max-width:900px;
    margin: 22px auto 0;
    padding: 0 28px;
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  #search{
    width:100%;
    padding:11px 14px;
    font-family:'IBM Plex Mono', monospace;
    font-size:13px;
    background:var(--card);
    border:1px solid var(--rule);
    border-radius:var(--radius);
    color:var(--ink);
  }
  #search:focus{ outline:2px solid var(--oxblood-dim); outline-offset:1px; }

  .filters{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
  }
  .filter-btn{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    padding:4px 11px;
    border:1px solid var(--rule);
    border-radius:20px;
    background:transparent;
    color:var(--ink-soft);
    cursor:pointer;
    transition:all .12s ease;
    letter-spacing:.02em;
  }
  .filter-btn:hover{
    border-color:var(--oxblood-dim);
    color:var(--ink);
  }
  .filter-btn.active{
    background:var(--oxblood);
    border-color:var(--oxblood);
    color:var(--card);
  }

  main{
    max-width:900px;
    margin: 28px auto 100px;
    padding: 0 28px;
  }

  .shelf{
    border-top: 1px solid var(--rule);
  }

  .entry-row{
    display:grid;
    grid-template-columns: 44px 1fr;
    gap: 18px;
    align-items:start;
    padding: 22px 6px;
    border-bottom: 1px solid var(--rule);
    cursor:pointer;
    transition: background .12s ease;
  }
  .entry-row:hover{ background: rgba(42,38,34,.035); }
  .entry-row:hover .entry-title{ color:var(--oxblood); }

  .spine{
    width:44px;
    height:60px;
    border-radius: 2px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    color:var(--card);
    font-weight:600;
    flex-shrink:0;
  }

  .kind{
    display:block;
    font-family:'IBM Plex Mono', monospace;
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:.1em;
    color:var(--ink-soft);
    margin:2px 0 5px;
  }
  .entry-title{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:19px;
    margin:0 0 4px;
    transition: color .12s ease;
  }
  .entry-author{
    font-size:14px;
    font-style:italic;
    color:var(--ink-soft);
    margin:0 0 8px;
  }
  .entry-summary{
    font-size:14px;
    color:var(--ink-soft);
    margin:0 0 11px;
    max-width:64ch;
  }
  .tag-row{ display:flex; flex-wrap:wrap; gap:6px; }
  .tag{
    font-family:'IBM Plex Mono', monospace;
    font-size:10px;
    padding:2px 8px;
    border:1px solid var(--rule);
    border-radius:20px;
    color:var(--ink-soft);
    cursor:pointer;
    transition:all .12s ease;
  }
  .tag:hover, .tag.active{
    background:var(--oxblood);
    border-color:var(--oxblood);
    color:var(--card);
  }

  #empty{
    text-align:center;
    padding: 60px 20px;
    color:var(--ink-soft);
    font-style:italic;
    display:none;
  }

  footer{
    max-width:900px;
    margin: 0 auto 60px;
    padding: 20px 28px;
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    color:var(--ink-soft);
    border-top:1px solid var(--rule);
    text-align:center;
  }
</style>
</head>
<body>

<header>
  <p class="kicker">Personal Knowledge Archive</p>
  <h1>The Archive</h1>
  <p class="lede">Notes, reading aids, and conceptual maps — rebuilt from books, essays, and original synthesis. A running record of ideas worth keeping.</p>
  <p class="count" id="count"></p>
</header>

<div class="controls">
  <input id="search" type="text" placeholder="Search title, creator, or tag…" autocomplete="off">
  <div class="filters" id="filters">
    <button class="filter-btn active" data-kind="all">All</button>
    <button class="filter-btn" data-kind="book">Books</button>
    <button class="filter-btn" data-kind="essay">Essays</button>
    <button class="filter-btn" data-kind="guide">Guides</button>
    <button class="filter-btn" data-kind="short story">Stories</button>
  </div>
</div>

<main>
  <div class="shelf" id="shelf"></div>
  <p id="empty">No entries match that search.</p>
</main>

<footer>the archive · a personal record of synthesized thought</footer>

<script>
/* ============================================================
   ENTRIES — one object per page.
   kind: "book" | "essay" | "guide" | "short story" | "synthesis"
   ============================================================ */
const ENTRIES = [
  {
    title: "How to Read a Book",
    author: "Mortimer J. Adler & Charles Van Doren",
    href: "how-to-read-a-book.html",
    kind: "book",
    summary: "A practical framework for reading with increasing levels of skill — elementary, inspectional, analytical, and syntopical — built around the habit of asking the right questions of a book.",
    tags: ["reading", "analytical-reading", "classics", "nonfiction"],
    accent: "#7c2e2a"
  },
  {
    title: "The Dragonbone Chair",
    author: "Tad Williams",
    href: "the-dragonbone-chair.html",
    kind: "book",
    summary: "Book 1 of Memory, Sorrow, and Thorn — a scullion boy at a dying king's castle is pulled into a slow-burning epic of buried history, sibling rivalry, and returning ancient magic.",
    tags: ["fantasy", "epic-fantasy", "memory-sorrow-and-thorn", "tad-williams"],
    accent: "#3a4a3a"
  },
  {
    title: "Building a Second Brain",
    author: "Tiago Forte",
    href: "building-a-second-brain.html",
    kind: "book",
    summary: "A digital system for capturing, organizing, distilling, and expressing what you consume — built on the CODE method and the PARA folder structure, and rooted in the old practice of commonplace books.",
    tags: ["PKM", "secondbrain", "notetaking", "productivity"],
    accent: "#a3792f"
  },
  {
    title: "Angel Down",
    author: "Daniel Kraus",
    href: "angel-down.html",
    kind: "book",
    summary: "WWI, the Argonne, October 1918 — burial-duty con man Cyril Bagger survives a shell that killed everyone around him, and starts hearing a shriek no one else can place.",
    tags: ["historical-fiction", "horror", "wwi", "daniel-kraus"],
    accent: "#7a2618"
  },
  {
    title: "Why All Roads Lead To Crab",
    author: "LivingZoo",
    href: "genotype-pinball.html",
    kind: "essay",
    summary: "Carcinization as a lens on convergent evolution — why unrelated decapod lineages keep re-evolving the crab body plan, and what that says about how genomes navigate possibility.",
    tags: ["biology", "evolution", "convergent-evolution"],
    accent: "#a3792f"
  },
  {
    title: "Game Theory & Poker",
    author: "Synthesized — Chen (SIG), Schmid, MIT 15.S50",
    href: "poker-game-theory.html",
    kind: "guide",
    summary: "A friendly walkthrough: why bluffing needs a frequency not a rule, a hand-solvable A/K/Q equilibrium, how CFR actually learns, taming no-limit's infinite bet sizes, why three-player games break every guarantee, a detour through the Josephus death-circle puzzle, and what any of it means for your home game.",
    tags: ["game-theory", "poker", "cfr", "nash-equilibrium", "quant-trading"],
    accent: "#b35a3a"
  },
  {
    title: "The Ones Who Walk Away from Omelas",
    author: "Ursula K. Le Guin",
    href: "omelas.html",
    kind: "short story",
    summary: "A utopian city's happiness turns out to depend entirely on one child kept in misery in a locked room. Most citizens stay and carry the knowledge; a few leave and walk into the dark, alone, towards a place the story never describes.",
    tags: ["short-story", "utopia", "ethics", "le-guin"],
    accent: "#15110d"
  },
  {
    title: "The Dog Stars",
    author: "Peter Heller",
    href: "dog-stars-constellation.html",
    kind: "book",
    summary: "Nine years after a superflu and a second, blood-borne collapse, a pilot named Hig flies the perimeter of what's left, holding onto a dog, a wary alliance with a survivalist neighbor, and a radio transmission he can't stop chasing. Rebuilt here as a clickable constellation of the book's characters and themes.",
    tags: ["literary-fiction", "post-apocalyptic", "peter-heller", "grief"],
    accent: "#d0a24e"
  },
  {
    title: "Deep Simplicity",
    author: "John Gribbin",
    href: "deep-simplicity-retention.html",
    kind: "book",
    summary: "From the three-body problem to the logistic map and Feigenbaum's universal constant — how simple, iterated rules with feedback generate chaos, fractals, and eventually life. Rebuilt here as an active-recall engine: predict before revealing, rate your own certainty.",
    tags: ["science", "chaos-theory", "complexity", "physics", "john-gribbin"],
    accent: "#35507c"
  },
  {
    title: "The Shadow of the Torturer",
    author: "Gene Wolfe",
    href: "new-sun-decoder.html",
    kind: "guide",
    summary: "Book 1 of The Book of the New Sun, decoded chapter by chapter — a vocabulary breakdown of Wolfe's Latinate, fossil-word prose, tracing the etymology and foreshadowing buried inside terms like fuligin, chrisos, and oubliette.",
    tags: ["science-fantasy", "gene-wolfe", "book-of-the-new-sun", "vocabulary"],
    accent: "#b8944e"
  },
  {
    title: "The Architecture of Evolution",
    author: "Synthesized — Gould, Conway Morris & Wagner",
    href: "architecture-of-evolution.html",
    kind: "guide",
    summary: "A three-way dialogue between Wonderful Life, Life's Solution, and Arrival of the Fittest — contingency vs. convergence vs. genotype space, and what it means for evolution to have direction without a destination.",
    tags: ["biology", "evolution", "contingency", "convergence", "philosophy-of-science"],
    accent: "#5b9a8b"
  }
];

const shelf = document.getElementById('shelf');
const countEl = document.getElementById('count');
const emptyEl = document.getElementById('empty');
const searchInput = document.getElementById('search');
const filterBtns = document.querySelectorAll('.filter-btn');

let activeTag = null;
let activeKind = 'all';

function initials(title){
  return title.split(' ').filter(w => /^[A-Z0-9]/.test(w)).slice(0,2).map(w=>w[0]).join('') || title[0];
}

function render(){
  const q = searchInput.value.trim().toLowerCase();
  const filtered = ENTRIES.filter(b => {
    const kindOk = activeKind === 'all' || b.kind === activeKind;
    const tagOk = !activeTag || (b.tags||[]).includes(activeTag);
    const hay = (b.title + ' ' + b.author + ' ' + (b.tags||[]).join(' ')).toLowerCase();
    const searchOk = !q || hay.includes(q);
    return kindOk && tagOk && searchOk;
  });

  countEl.textContent = `${ENTRIES.length} entr${ENTRIES.length===1?'y':'ies'} in the archive`;
  shelf.innerHTML = '';
  emptyEl.style.display = filtered.length ? 'none' : 'block';

  filtered.forEach(b => {
    const row = document.createElement('div');
    row.className = 'entry-row';
    row.innerHTML = `
      <a href="${b.href}" class="spine" style="background: ${b.accent || '#7c2e2a'}">${initials(b.title)}</a>
      <div>
        <a href="${b.href}" style="text-decoration:none;color:inherit;">
          ${b.kind ? `<span class="kind">${b.kind}</span>` : ''}
          <p class="entry-title">${b.title}</p>
          <p class="entry-author">${b.author}</p>
          ${b.summary ? `<p class="entry-summary">${b.summary}</p>` : ''}
        </a>
        ${b.tags && b.tags.length ? `<div class="tag-row">${b.tags.map(t=>`<span class="tag ${t===activeTag?'active':''}" data-tag="${t}">${t}</span>`).join('')}</div>` : ''}
      </div>
    `;
    shelf.appendChild(row);
  });

  shelf.querySelectorAll('.tag').forEach(el => {
    el.addEventListener('click', (e) => {
      e.preventDefault();
      const t = el.dataset.tag;
      activeTag = (activeTag === t) ? null : t;
      render();
    });
  });
}

filterBtns.forEach(btn => {
  btn.addEventListener('click', () => {
    filterBtns.forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeKind = btn.dataset.kind;
    render();
  });
});

searchInput.addEventListener('input', render);
render();
</script>

</body>
</html>
