<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Archive — Notes &amp; Reading Aids</title>
<meta name="description" content="Archive — a personal shelf of notes, reading companions, essays, and guides worth keeping.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='4' y='9' width='24' height='17' rx='2' fill='%237c2e2a'/%3E%3Crect x='4' y='13' width='24' height='3' fill='%23f5f1e8'/%3E%3Crect x='13' y='6' width='6' height='4' rx='1' fill='%237c2e2a'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f1e8;
    --ink: #1c1916;
    --muted: #6b655c;
    --line: #d4cbb8;
    --accent: #7c2e2a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Source Serif 4', Georgia, serif;
    font-size: 16px;
    line-height: 1.55;
    max-width: 640px;
    margin: 0 auto;
    padding: 48px 24px 80px;
  }
  header { margin-bottom: 36px; }
  h1 {
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 500;
    font-size: 13px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 6px;
  }
  .lede {
    color: var(--muted);
    font-size: 15px;
  }
  .meta {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: .06em;
    color: var(--muted);
    margin-top: 8px;
  }
  #search {
    width: 100%;
    padding: 10px 0;
    margin-bottom: 28px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--line);
    color: var(--ink);
    outline: none;
  }
  #search::placeholder { color: var(--muted); }
  #search:focus { border-bottom-color: var(--ink); }

  .filters {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 32px;
  }
  .filter-btn {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: .04em;
    padding: 3px 10px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
  }
  .filter-btn.active,
  .filter-btn:hover {
    border-color: var(--ink);
    color: var(--ink);
  }

  .entry {
    padding: 18px 0;
    border-top: 1px solid var(--line);
  }
  .entry:last-child { border-bottom: 1px solid var(--line); }
  .kind {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 4px;
  }
  .title {
    font-size: 17px;
    font-weight: 500;
    color: var(--ink);
    text-decoration: none;
  }
  .title:hover { color: var(--accent); }
  .author {
    font-size: 14px;
    font-style: italic;
    color: var(--muted);
    margin: 3px 0 6px;
  }
  .summary {
    font-size: 14px;
    color: var(--muted);
    max-width: 54ch;
  }
  .tags {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 10px;
  }
  .tag {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    padding: 2px 8px;
    border: 1px solid var(--line);
    border-radius: 999px;
    color: var(--muted);
    cursor: pointer;
  }
  .tag:hover, .tag.active {
    border-color: var(--ink);
    color: var(--ink);
  }

  #empty {
    text-align: center;
    padding: 40px 0;
    color: var(--muted);
    font-style: italic;
    display: none;
  }
  footer {
    margin-top: 48px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    text-align: center;
  }
</style>
<link rel="stylesheet" href="archive-bar.css">
<script src="archive-bar.js" defer></script>
</head>
<body>

<header>
  <h1>Archive</h1>
  <p class="lede">Notes and reading aids worth keeping.</p>
  <p class="meta">20 entries &middot; updated September 2026</p>
</header>

<input id="search" type="search" placeholder="Search…" autocomplete="off">

<div class="filters" id="filters">
  <button class="filter-btn active" data-kind="all">All</button>
  <button class="filter-btn" data-kind="book">Books</button>
  <button class="filter-btn" data-kind="essay">Essays</button>
  <button class="filter-btn" data-kind="guide">Guides</button>
  <button class="filter-btn" data-kind="short story">Stories</button>
  <button class="filter-btn" data-kind="app">Apps</button>
</div>

<main id="shelf"></main>
<p id="empty">No matches.</p>

<footer>archive</footer>

<script>
const ENTRIES = [
  {
    title: "Sightline",
    author: "Prototype — eight country desks",
    href: "sightline.html",
    kind: "app",
    summary: "A reader for what other countries are talking about. Eight desks, a Water Cooler card carrying one translated local headline, a session Rolodex of everyone you've read about, and a 7 a.m. sheet. Sample data on a simulated wire — no live feeds.",
    tags: ["prototype", "interface", "news", "translation", "world"]
  },
  {
    title: "Little Brother",
    author: "Cory Doctorow",
    href: "little-brother-notes.html",
    kind: "book",
    summary: "Chapters 1–3 — a teenage hacker's San Francisco, from gait-recognition cameras to a Treasure Island interrogation cell. Read five ways: Adler, craft, cognitive, reader-response, systems.",
    tags: ["cory-doctorow", "surveillance", "young-adult", "chapter-notes", "techno-thriller"]
  },
  {
    title: "Depth Axis",
    author: "C. G. Jung — Memories, Dreams, Reflections",
    href: "jung-analytical.html",
    kind: "guide",
    summary: "Twelve chapters read with Adler & Van Doren’s rules. Unity, terms, propositions, objections, and marked passages for the whole book.",
    tags: ["jung", "analytical-reading", "psychology", "memoir"]
  },
  {
    title: "How to Read a Book",
    author: "Mortimer J. Adler & Charles Van Doren",
    href: "how-to-read-a-book.html",
    kind: "book",
    summary: "A practical framework for reading with increasing levels of skill — elementary, inspectional, analytical, and syntopical.",
    tags: ["reading", "analytical-reading", "classics"]
  },
  {
    title: "The Dragonbone Chair",
    author: "Tad Williams",
    href: "the-dragonbone-chair.html",
    kind: "book",
    summary: "Book 1 of Memory, Sorrow, and Thorn — a scullion boy pulled into a slow-burning epic of buried history and returning magic.",
    tags: ["fantasy", "epic-fantasy", "tad-williams"]
  },
  {
    title: "Building a Second Brain",
    author: "Tiago Forte",
    href: "building-a-second-brain.html",
    kind: "book",
    summary: "A digital system for capturing, organizing, distilling, and expressing what you consume — CODE and PARA.",
    tags: ["PKM", "secondbrain", "notetaking"]
  },
  {
    title: "Angel Down",
    author: "Daniel Kraus",
    href: "angel-down.html",
    kind: "book",
    summary: "WWI, the Argonne, 1918 — a burial-duty con man survives a shell and starts hearing a shriek no one else can place.",
    tags: ["historical-fiction", "horror", "wwi"]
  },
  {
    title: "Why All Roads Lead To Crab",
    author: "LivingZoo",
    href: "genotype-pinball.html",
    kind: "essay",
    summary: "Carcinization as a lens on convergent evolution — why unrelated lineages keep re-evolving the crab body plan.",
    tags: ["biology", "evolution", "convergent-evolution"]
  },
  {
    title: "Game Theory & Poker",
    author: "Synthesized — Chen, Schmid, MIT 15.S50",
    href: "poker-game-theory.html",
    kind: "guide",
    summary: "Why bluffing needs a frequency, a hand-solvable A/K/Q equilibrium, how CFR learns, and what it means for a home game.",
    tags: ["game-theory", "poker", "nash-equilibrium"]
  },
  {
    title: "The Ones Who Walk Away from Omelas",
    author: "Ursula K. Le Guin",
    href: "omelas.html",
    kind: "short story",
    summary: "A city’s happiness depends on one child kept in misery. Most stay; a few walk away into the dark.",
    tags: ["short-story", "utopia", "ethics", "le-guin"]
  },
  {
    title: "The Dog Stars",
    author: "Peter Heller",
    href: "dog-stars-constellation.html",
    kind: "book",
    summary: "Nine years after collapse, a pilot holds onto a dog, a wary neighbor, and a radio transmission he can’t stop chasing.",
    tags: ["literary-fiction", "post-apocalyptic", "grief"]
  },
  {
    title: "Deep Simplicity",
    author: "John Gribbin",
    href: "deep-simplicity-retention.html",
    kind: "book",
    summary: "From the three-body problem to Feigenbaum’s constant — how simple iterated rules generate chaos, fractals, and life.",
    tags: ["science", "chaos-theory", "complexity"]
  },
  {
    title: "The Shadow of the Torturer",
    author: "Gene Wolfe",
    href: "new-sun-decoder.html",
    kind: "guide",
    summary: "Book 1 of The Book of the New Sun, decoded — vocabulary and foreshadowing in Wolfe’s Latinate prose.",
    tags: ["science-fantasy", "gene-wolfe", "vocabulary"]
  },
  {
    title: "The Architecture of Evolution",
    author: "Synthesized — Gould, Conway Morris & Wagner",
    href: "architecture-of-evolution.html",
    kind: "guide",
    summary: "Contingency vs. convergence vs. genotype space — what it means for evolution to have direction without a destination.",
    tags: ["biology", "evolution", "philosophy-of-science"]
  },
  {
    title: "The Man Who Mapped the Stars",
    author: "Synthesized — Mackay, Odlyzko",
    href: "south-sea-newton.html",
    kind: "essay",
    summary: "Newton’s 1720 South Sea trades — analytical correctness losing to social pressure, reconstructed from the papers.",
    tags: ["financial-history", "south-sea-bubble", "isaac-newton"]
  },
  {
    title: "Dionysus — The God Who Refuses to Die",
    author: "Compiled study",
    href: "dionysus.html",
    kind: "essay",
    summary: "A field guide to the god of ecstasy, madness, and the dissolution of the self: his birth, his symbols, his powers, his entourage, his enemies — and the two-and-a-half-thousand-year argument over whether he is a liberator or a warning.",
    tags: ["mythology", "greek-mythology", "dionysus"]
  },
  {
    title: "The Mogul File",
    author: "Case file — Roswell, 1947",
    href: "mogul-case-file.html",
    kind: "essay",
    summary: "A case file on the debris that fell near Roswell, New Mexico — the lie told to protect it, the myth that outgrew both, and the physics that explains all three.",
    tags: ["roswell", "ufo", "history", "cold-war"]
  },
  {
    title: "Wrath — The Education of the Fierce Refusal",
    author: "Layered inquiry",
    href: "wrath.html",
    kind: "essay",
    summary: "A layered inquiry into the nature of wrath, drawing from Thich Nhat Hanh, cognitive-behavioral psychology, and the Hermetic tradition.",
    tags: ["philosophy", "psychology", "anger"]
  },
  {
    title: "Your Pathology Report, Explained",
    author: "Patient guide",
    href: "pathology-report-explained.html",
    kind: "guide",
    summary: "A step-by-step translation of the report from your surgery, without the medical jargon.",
    tags: ["health", "medicine", "explainer"]
  },
  {
    title: "Building a Second Brain — Reading Notes",
    author: "Tiago Forte — notes",
    href: "second-brain-notes.html",
    kind: "book",
    summary: "Four steps to move information from capture to creation, and four folders to hold it while you do. Companion notes to the book.",
    tags: ["PKM", "secondbrain", "notetaking", "notes"]
  }
];

const shelf = document.getElementById('shelf');
const emptyEl = document.getElementById('empty');
const searchInput = document.getElementById('search');
const filterBtns = document.querySelectorAll('.filter-btn');

let activeTag = null;
let activeKind = 'all';

function render() {
  const q = searchInput.value.trim().toLowerCase();
  const filtered = ENTRIES.filter(b => {
    const kindOk = activeKind === 'all' || b.kind === activeKind;
    const tagOk = !activeTag || (b.tags || []).includes(activeTag);
    const hay = (b.title + ' ' + b.author + ' ' + (b.tags || []).join(' ')).toLowerCase();
    return kindOk && tagOk && (!q || hay.includes(q));
  });

  shelf.innerHTML = '';
  emptyEl.style.display = filtered.length ? 'none' : 'block';

  filtered.forEach(b => {
    const el = document.createElement('article');
    el.className = 'entry';
    el.innerHTML = `
      <div class="kind">${b.kind}</div>
      <a class="title" href="${b.href}">${b.title}</a>
      <div class="author">${b.author}</div>
      ${b.summary ? `<p class="summary">${b.summary}</p>` : ''}
      ${b.tags?.length ? `<div class="tags">${b.tags.map(t =>
        `<span class="tag ${t === activeTag ? 'active' : ''}" data-tag="${t}">${t}</span>`
      ).join('')}</div>` : ''}
    `;
    shelf.appendChild(el);
  });

  shelf.querySelectorAll('.tag').forEach(el => {
    el.addEventListener('click', e => {
      e.preventDefault();
      const t = el.dataset.tag;
      activeTag = activeTag === t ? null : t;
      render();
    });
  });
}

filterBtns.forEach(btn => {
  btn.addEventListener('click', () => {
    filterBtns.forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeKind = btn.dataset.kind;
    render();
  });
});

searchInput.addEventListener('input', render);
render();
</script>
</body>
</html>
