      "html": "<h1>Chapter 9: Determining an Author's Message</h1>\n<h2>1. Conceptual Overview &amp; The Two Layers</h2>\n<p>Adler distinguishes between the <strong>grammatical layer</strong> (units of language) and the <strong>logical layer</strong> (units of thought or knowledge). Sentences and paragraphs are things you see on the page; propositions and arguments are what those sentences and paragraphs mean as judgments and reasons.</p>\n<p>Because language is an imperfect medium, there is never a strict one-to-one mapping between grammar and logic: one sentence can contain multiple propositions, and one proposition can be expressed in many different sentences. The task of the analytical reader is to penetrate the surface of words, sentences, and paragraphs in order to grasp terms, propositions, and arguments as elements of thought.</p>\n<h3>📊 Grammatical vs. Logical Units</h3>\n<table>\n<thead>\n<tr>\n<th style=\"text-align: left;\">Grammatical (Language)</th>\n<th style=\"text-align: left;\">Logical (Thought)</th>\n<th style=\"text-align: left;\">Relationship for the Reader</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align: left;\"><strong>Words</strong></td>\n<td style=\"text-align: left;\"><span class=\"wikilink\">Terms</span></td>\n<td style=\"text-align: left;\">One word can express several terms; one term can be expressed by several different words.</td>\n</tr>\n<tr>\n<td style=\"text-align: left;\"><strong>Sentences</strong></td>\n<td style=\"text-align: left;\"><span class=\"wikilink\">Propositions</span></td>\n<td style=\"text-align: left;\">Not every sentence expresses a proposition (questions, wishes, commands do not), and a single complex sentence may contain several distinct propositions.</td>\n</tr>\n<tr>\n<td style=\"text-align: left;\"><strong>Paragraphs</strong></td>\n<td style=\"text-align: left;\"><span class=\"wikilink\">Arguments</span></td>\n<td style=\"text-align: left;\">Arguments usually require multiple sentences or even multiple paragraphs, and may be spread out rather than confined to a single visible block of text.</td>\n</tr>\n</tbody>\n</table>\n<div class=\"callout callout-important\"><p class=\"callout-title\">Key Orientation</p><div class=\"callout-body\"><p>The active reader must attend simultaneously to grammatical units (what is literally written) and logical units (what is actually being asserted or inferred) in order to grasp an author's message.</p></div></div>\n\n<hr />\n<h2>2. Rule 6: Propositions (Key Sentences &amp; Judgments)</h2>\n<div class=\"callout callout-abstract\"><p class=\"callout-title\">Rule 6 — Core Formula</p><div class=\"callout-body\"><p><strong>Mark the most important sentences in a book and discover the propositions they contain.</strong></p></div></div>\n\n<p>Adler defines a proposition as an author's judgment: an affirmation of something as true or a denial of something as false. These are expressed in declarative sentences, not in questions, wishes, or mere statements of intention.</p>\n<h3>2.1 Distinguishing Sentences from Propositions</h3>\n<p>Not every sentence expresses a proposition:</p>\n<ul>\n<li>\n<p><strong>Questions</strong> state problems rather than answers.</p>\n</li>\n<li>\n<p><strong>Wishes and intentions</strong> reveal purposes but not the knowledge being expounded.</p>\n</li>\n</ul>\n<p>Even when sentences are declarative, they may express:</p>\n<ul>\n<li>\n<p>Multiple propositions (compound or highly complex sentences).</p>\n</li>\n<li>\n<p>Different propositions on different occasions if key terms shift meaning.</p>\n</li>\n</ul>\n<div class=\"callout callout-example\"><p class=\"callout-title\">Parsing a Complex Sentence (Machiavelli's *The Prince*)</p><div class=\"callout-body\"><p>Adler analyzes a single complex sentence from Machiavelli to show it contains three distinct propositions: \n1. A prince should inspire fear in a certain way.\n2. He can endure being feared as long as he is not hated.\n3. He avoids hatred by refraining from taking his subjects’ property and women.</p>\n<p><em>Unless you separate these, you cannot make a discriminating judgment to agree or disagree with the author.</em></p></div></div>\n\n<div class=\"callout callout-tip\"><p class=\"callout-title\">How to Apply Rule 6 While Reading</p><div class=\"callout-body\"><ol start=\"4\">\n<li><strong>Identify the most important sentences</strong> — those that carry the main weight of the author's teaching or cause you the most perplexity.</li>\n<li><strong>Extract the propositions</strong> by unpacking compound constructions (<em>\"and,\" \"if...then,\" \"not only...but also,\" \"because,\" \"therefore\"</em>).</li>\n<li><strong>Rephrase each proposition</strong> in your own clear, minimal wording.</li>\n<li><strong>Notice shifts in terms</strong> where the same sentence might mean something different in another context.</li>\n</ol></div></div>\n\n<hr />\n<h2>3. Rule 7: Arguments (Constructing the Author’s Reasoning)</h2>\n<div class=\"callout callout-abstract\"><p class=\"callout-title\">Rule 7 — Core Formula</p><div class=\"callout-body\"><p><strong>Locate or construct the basic arguments in the book by finding them in the connection of sentences.</strong></p></div></div>\n\n<p>An argument is a set or series of statements in which some provide the reasons for a conclusion. The author’s propositions are mere opinions unless they are supported by arguments that show <em>why</em> the reader ought to be persuaded.</p>\n<h3>3.1 Why Arguments $\\neq$ Paragraphs</h3>\n<p>Adler explicitly warns that arguments do not always coincide with single paragraphs. </p>\n<div class=\"callout callout-warning\"><p class=\"callout-title\">Structural Pitfall</p><div class=\"callout-body\"><p>The worst mistake is to assume a one-to-one mapping between paragraphs and arguments. Arguments are logical structures that may cut across multiple paragraphs or be compressed into a single compound sentence.</p></div></div>\n\n<h3>3.2 Constructing Arguments from Sentences</h3>\n<ol>\n<li><strong>Look for indicator words:</strong> <em>\"Because,\" \"since,\" \"if...then,\" \"therefore,\" \"it follows that,\" \"for this reason.\"</em></li>\n<li><strong>Separate Premises from Conclusions:</strong> Premises are the grounds; conclusions are what you are being asked to accept.</li>\n<li><strong>Check for Validity:</strong> A valid argument is one where the conclusion follows from the premises, even if the premises themselves are factually false.</li>\n</ol>\n<div class=\"callout callout-example\"><p class=\"callout-title\">Micro-Outline of an Argument (Adler's logic)</p><div class=\"callout-body\"><ul>\n<li>\n<p><strong>Premise A:</strong> Adults no longer in school must continue learning on their own.</p>\n</li>\n<li>\n<p><strong>Premise B:</strong> To continue learning on their own, they must learn from books (absent teachers).</p>\n</li>\n<li>\n<p><strong>Conclusion:</strong> Therefore, they must know how to make books teach them well (analytical reading).</p>\n</li>\n</ul></div></div>\n\n<hr />\n<h2>4. The Two “Acid Tests” for Escaping Verbalism</h2>\n<p>Adler is deeply concerned with <strong>verbalism</strong>—the bad habit of parroting an author's words without digesting the thought. To ensure you have actually understood a proposition, apply these two tests:</p>\n<div class=\"callout callout-quote\"><p class=\"callout-title\">The Two Tests of Understanding</p><div class=\"callout-body\"><ol>\n<li><strong>Translation:</strong> Can you restate the author’s key propositions and arguments in your own words without losing the meaning? If you must use their exact words, you only grasp the vocabulary, not the mind.</li>\n<li><strong>Exemplification:</strong> Can you provide concrete, real-world examples (or imagine a possible case) that illustrate the proposition or structure of the argument? </li>\n</ol></div></div>\n\n<div class=\"callout callout-tip\"><p class=\"callout-title\">Practical Use</p><div class=\"callout-body\"><p>After identifying a key sentence and extracting its propositions (Rule 6), apply these two tests before you decide whether you agree or disagree. This ensures you are critiquing the author’s actual view, not a misunderstanding.</p></div></div>\n\n<hr />\n<h2>5. Interlinking and Graph Connections</h2>\n<ul>\n<li>\n<p><span class=\"wikilink\">How to Read a Book – Overview</span></p>\n</li>\n<li>\n<p><span class=\"wikilink\">Analytical Reading Stage 1</span> – Structural outline (Rules 1–4) that meets Chapter 9 at the level of propositions and arguments.</p>\n</li>\n<li>\n<p><span class=\"wikilink\">Analytical Reading Stage 2</span> – Content interpretation: terms, propositions, arguments, solutions (Rules 5–8).</p>\n</li>\n<li>\n<p><span class=\"wikilink\">Active Reading</span> – Habits of marking, questioning, and summarizing that operationalize Rules 6 and 7.</p>\n</li>\n<li>\n<p><span class=\"wikilink\">Syntax vs Logic</span> – The distinction between grammatical form (sentences, paragraphs) and logical form (propositions, arguments).</p>\n</li>\n<li>\n<p><span class=\"wikilink\">Terms, Propositions, and Arguments</span> – Local node for Chapter 8–9 distinctions.</p>\n</li>\n<li>\n<p><span class=\"wikilink\">Verbalism and Understanding</span> – Notes focused on Adler’s “acid tests” and the problem of parroting.</p>\n</li>\n</ul>\n<hr />\n<h2>6. Interactive Active-Reading Workspace (Chapter 9 Practice)</h2>\n<p>Use this template to practice applying Chapter 9 to any expository text you are currently reading.</p>\n<h3>📌 Work Item Metadata</h3>\n<ul>\n<li><strong>Source Title:</strong> * <strong>Author:</strong> * <strong>Edition / Pages:</strong> * <strong>Context in my reading project:</strong> <span class=\"wikilink\">Active Reading</span> · <span class=\"wikilink\">Analytical Reading Stage 2</span></li>\n</ul>\n<h3>🔍 Step 1 – Identify the Key Sentence (Rule 6)</h3>\n<ul>\n<li><strong>Quoted Sentence:</strong> * <strong>Why it is important:</strong> * <strong>Indicators present</strong> (<em>because, therefore, and, if...then</em>): </li>\n</ul>\n<h3>🧬 Step 2 – Extract the Propositions (Judgments)</h3>\n<ul>\n<li><strong>Proposition 1:</strong> * <strong>Proposition 2:</strong> * <strong>Proposition 3:</strong> ### 🗣️ Step 3 – Translation Test (Anti-Verbalism #1)</li>\n</ul>\n<div class=\"callout callout-question\"><p class=\"callout-title\">My Own Words Translation</p><div class=\"callout-body\"><ul>\n<li>\n<p><strong>P1 Translation:</strong> &gt; * <strong>P2 Translation:</strong> ### 🌍 Step 4 – Exemplification Test (Anti-Verbalism #2)\n[!example] Real-World Example</p>\n</li>\n<li>\n<p><strong>Concrete Example:</strong> &gt; * <strong>Counter-example/Limiting Case:</strong> ### 📐 Step 5 – Locate or Construct the Argument (Rule 7)</p>\n</li>\n</ul></div></div>\n\n<ul>\n<li>\n<p><strong>Location in text (Pages/Paragraphs):</strong> * <strong>Premise 1:</strong> * <strong>Premise 2:</strong> * <strong>Conclusion:</strong> * <strong>Reconstructed argument in standard form:</strong></p>\n</li>\n<li>\n<p>$P1$</p>\n</li>\n<li>\n<p>$P2$</p>\n</li>\n<li>\n<p>$\\therefore C$</p>\n</li>\n</ul>\n<h3>🏁 Step 6 – Reflective Checkpoint</h3>\n<ul>\n<li>\n<p>Do I genuinely understand the author’s message at this point? Why / why not?</p>\n</li>\n<li>\n<p><strong>Next Action:</strong> (e.g., Proceed to criticism, or re-read section to clarify terms).</p>\n</li>\n</ul>",

      "html": "<h1>Chapter 10: Criticizing a Book Fairly</h1>\n<h2>🌌 1. The Conversational Nature of Reading</h2>\n<p>Reading is a delayed conversation where the author speaks first, and the reader has the final word. </p>\n<ul>\n<li>\n<p><strong>Teachability:</strong> Not passive subservience, but the active exercise of independent judgment after a full hearing.</p>\n</li>\n<li>\n<p><strong>The Role of Rhetoric:</strong> How the author persuades, and how the reader responsibly reacts to that persuasion.</p>\n</li>\n</ul>\n<hr />\n<h2>⚖️ 2. The Three General Maxims of Intellectual Etiquette</h2>\n<div class=\"callout callout-abstract\"><p class=\"callout-title\">Rule 9: The Prerequisite of Understanding</p><div class=\"callout-body\"><p><strong>You must be able to say, with reasonable certainty, \"I understand,\" before you can say \"I agree,\" \"I disagree,\" or \"I suspend judgment.\"</strong></p>\n<ul>\n<li>\n<p>To disagree without understanding is impudent.</p>\n</li>\n<li>\n<p>To agree without understanding is inane.</p>\n</li>\n<li>\n<p>Suspending judgment is an active critical choice (asserting that a point has not been proven).</p>\n</li>\n</ul></div></div>\n\n<div class=\"callout callout-abstract\"><p class=\"callout-title\">Rule 10: Non-Contentious Disagreement</p><div class=\"callout-body\"><p><strong>When you disagree, do so reasonably, and not disputatiously or contentiously.</strong></p>\n<ul>\n<li>\n<p>The goal of reading is learning the truth, not winning an argument.</p>\n</li>\n<li>\n<p>Approach books to gain knowledge, not to knock the author down. Be as prepared to agree as you are to disagree.</p>\n</li>\n</ul></div></div>\n\n<div class=\"callout callout-abstract\"><p class=\"callout-title\">Rule 11: Knowledge vs. Mere Opinion</p><div class=\"callout-body\"><p><strong>Respect the difference between knowledge and mere personal opinion, by giving reasons for any critical judgment you make.</strong></p>\n<ul>\n<li>\n<p>Unsupported disagreement is just venting personal prejudice.</p>\n</li>\n<li>\n<p>Knowledge consists of testable, objective opinions backed by reasons and evidence.</p>\n</li>\n</ul></div></div>\n\n<hr />\n<h2>🔗 3. Interlinking and Graph Connections</h2>\n<ul>\n<li>\n<p><span class=\"wikilink\">How to Read a Book – Overview</span></p>\n</li>\n<li>\n<p><span class=\"wikilink\">Analytical Reading Stage 3</span> — The rules of criticism and fair judgment.</p>\n</li>\n<li>\n<p><span class=\"wikilink\">Rhetoric and Persuasion</span> — The art of communication and taking a responsible intellectual stance.</p>\n</li>\n<li>\n<p><span class=\"wikilink\">The Virtue of Teachability</span> — True critical thinking vs. passive reading.</p>\n</li>\n<li>\n<p><span class=\"wikilink\">Rule 12: Specific Criteria for Criticism</span> — The concrete points of disagreement (uninformed, misinformed, illogical, incomplete).</p>\n</li>\n</ul>\n<hr />\n<h2>🛠️ 4. Interactive Workspace: Applying Intellectual Etiquette</h2>\n<p>Use this workspace to check your posture before you criticize a current reading project.</p>\n<h3>📌 Session Metadata</h3>\n<ul>\n<li>\n<p><strong>Source Title:</strong></p>\n</li>\n<li>\n<p><strong>Context / Project:</strong> <span class=\"wikilink\">Active Reading</span></p>\n</li>\n</ul>\n<h3>🚦 Step 1: The Understanding Check (Rule 9)</h3>\n<div class=\"callout callout-check\"><p class=\"callout-title\">Can I state the author's main propositions and arguments in my own words?</p><div class=\"callout-body\"><ul>\n<li><strong>The Author's Main Thesis:</strong> &gt; * <strong>The Supporting Arguments:</strong> &gt; * <em>If I cannot do this, I must pause before rendering a final judgment.</em></li>\n</ul></div></div>\n\n<h3>🧘‍♂️ Step 2: The Emotional Check (Rule 10)</h3>\n<div class=\"callout callout-question\"><p class=\"callout-title\">Am I reading to find the truth, or am I reading to pick a fight?</p><div class=\"callout-body\"><ul>\n<li><strong>Points where I naturally feel defensive/resistant:</strong> &gt; * <strong>Am I giving the author a fair, sympathetic hearing?</strong> ### ⚖️ Step 3: The Rational Burden (Rule 11)</li>\n</ul></div></div>\n<p>If I plan to <strong>disagree</strong> or <strong>suspend judgment</strong>, what are my objective reasons?</p>\n<table>\n<thead>\n<tr>\n<th style=\"text-align: left;\">Point of Contention</th>\n<th style=\"text-align: left;\">My Counter-Evidence / Reasons</th>\n<th style=\"text-align: left;\">Is this Knowledge or Just My Opinion?</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align: left;\"><em>Example point</em></td>\n<td style=\"text-align: left;\"><em>Example counter-reason</em></td>\n<td style=\"text-align: left;\"><em>Objective Knowledge / Personal Feeling</em></td>\n</tr>\n<tr>\n<td style=\"text-align: left;\"></td>\n<td style=\"text-align: left;\"></td>\n<td style=\"text-align: left;\"></td>\n</tr>\n</tbody>\n</table>\n<h4>🏁 Final Pre-Criticism Verdict</h4>\n<ul>\n<li>\n<p>[ ] <strong>I am ready to Agree</strong> (I accept the author's premises and conclusions).</p>\n</li>\n<li>\n<p>[ ] <strong>I am ready to Disagree</strong> (I have objective counter-evidence to present).</p>\n</li>\n<li>\n<p>[ ] <strong>I Suspend Judgment</strong> (The author's argument is currently incomplete or unproven).</p>\n</li>\n</ul>\n<h2>yaml</h2>\n<p>title: \"Ch 10 - Criticizing a Book Fairly\"\nalias: [\"10 Criticizing a Book Fairly\", \"Rules for Talking Back to an Author\"]\ntags:</p>\n<ul>\n<li>\n<p>how-to-read-a-book</p>\n</li>\n<li>\n<p>adler</p>\n</li>\n<li>\n<p>analytical-reading</p>\n</li>\n<li>\n<p>stage-3-criticism</p>\n</li>\n<li>\n<p>intellectual-etiquette</p>\n</li>\n<li>\n<p>rules-of-reading</p>\n</li>\n<li>\n<p>pkmsystem\ncreated: \nmodified: \nchapter: 10\nbook: \"How to Read a Book\"\nauthors: \"Mortimer J. Adler &amp; Charles Van Doren\"\nstatus: \"Completed\"\ntype: \"Book Chapter Note\"\nsummary: \"The transition from understanding to judgment. Introduces the third stage of analytical reading and the three general maxims of intellectual etiquette (Rules 9–11) for fair criticism.\"\nrating: 9.5</p>\n</li>\n</ul>\n<hr />\n<h1>Ch 10 - Criticizing a Book Fairly</h1>\n<blockquote>\n<p>“Reading a book is a kind of conversation. … The reader has the last word.”<br />\n— Adler &amp; Van Doren</p>\n</blockquote>\n<h2>📌 Chapter Overview</h2>\n<p><strong>Stage 3: Criticism</strong> — The reward of all previous analytical effort.</p>\n<p>After you have <strong>classified</strong> the book (Stage 1) and <strong>understood</strong> the author’s message (Stage 2), you are now ready (and obligated) to <strong>talk back</strong> — to judge the book fairly.</p>\n<p>This chapter teaches the <strong>intellectual etiquette</strong> required for honest, profitable conversation with an author.</p>\n<div class=\"callout callout-abstract\"><p class=\"callout-title\">Core Idea</p><div class=\"callout-body\"><p>A good reader is <strong>teachable</strong> — which means actively critical, not passive. Criticism must follow understanding. Disagreement should serve truth, not ego.</p></div></div>\n\n<hr />\n<h2>🎯 The Three General Maxims of Critical Reading</h2>\n<div class=\"callout callout-tip\"><p class=\"callout-title\">Rule 9 – Complete Understanding Before Judgment</p><div class=\"callout-body\"><p><strong>You must be able to say, with reasonable certainty, “I understand” before you can say “I agree,” “I disagree,” or “I suspend judgment.”</strong></p>\n<ul>\n<li>\n<p>Understanding is a <strong>precondition</strong> for any fair criticism.</p>\n</li>\n<li>\n<p>Premature agreement is inane; premature disagreement is impudent.</p>\n</li>\n<li>\n<p>Suspending judgment is also an act of criticism — it claims the author has not yet convinced you.</p>\n</li>\n</ul>\n<p><strong>Why it matters:</strong> Many people skip straight to judgment. This rule prevents that intellectual vice.</p></div></div>\n\n<hr />\n<div class=\"callout callout-tip\"><p class=\"callout-title\">Rule 10 – Disagree Reasonably, Not Contentiously</p><div class=\"callout-body\"><p><strong>When you disagree, do so reasonably and not disputatiously or contentiously.</strong></p>\n<ul>\n<li>\n<p>Conversation is not a battle to be won.</p>\n</li>\n<li>\n<p>The goal is <strong>truth</strong>, not victory.</p>\n</li>\n<li>\n<p>Admit points when you see them; never feel “whipped” by having to agree.</p>\n</li>\n</ul>\n<p><strong>Plato &amp; Aristotle reminder:</strong> Honor truth above friendship or ego.</p></div></div>\n\n<hr />\n<div class=\"callout callout-tip\"><p class=\"callout-title\">Rule 11 – Give Reasons; Respect Knowledge vs. Opinion</p><div class=\"callout-body\"><p><strong>Respect the difference between knowledge and mere personal opinion by giving reasons for any critical judgment you make.</strong></p>\n<ul>\n<li>\n<p>If the author offers <strong>reasons</strong>, treat the claim as knowledge (open to reasoned refutation).</p>\n</li>\n<li>\n<p>If the author offers only unsupported assertions, it is <strong>mere opinion</strong>.</p>\n</li>\n<li>\n<p>You must do the same: back your agreement or disagreement with grounds.</p>\n</li>\n</ul>\n<p><strong>Key distinction:</strong> Knowledge = defensible opinions supported by evidence. Opinion = unsupported personal feeling.</p></div></div>\n\n<hr />\n<h2>🧩 Visual Summary – The Three Rules of Fair Criticism</h2>\n<div class=\"mermaid\">flowchart TD\n    A[Stage 3: Criticizing a Book Fairly] --> B[Rule 9\\nUnderstand First]\n    A --> C[Rule 10\\nDisagree Reasonably]\n    A --> D[Rule 11\\nGive Reasons\\nKnowledge vs Opinion]\n    \n    B --> E[\"'I understand' before any judgment\"]\n    C --> F[\"Seek truth, not victory\"]\n    D --> G[\"Always explain WHY you agree or disagree\"]</div>`</p>",

const mainEl = document.getElementById('main');
const tocEl = document.getElementById('toc');
document.getElementById('book-title').textContent = BOOK.title;
document.getElementById('book-authors').textContent = BOOK.authors;

let currentView = { type: 'chapter', chapter: BOOK.chapters[0].chapter };
let activeStage = 'all';
const STAGES = ['Stage 1: Structure', 'Stage 2: Interpretation', 'Stage 3: Criticism'];
const stageNum = s => s.startsWith('Stage 1') ? 1 : s.startsWith('Stage 2') ? 2 : 3;

/* ---------- persistent progress (window.storage) ---------- */
const progressCache = {};
async function loadChapterProgress(num){
  if(progressCache[num]) return progressCache[num];
  try{
    const res = await window.storage.get('htrab-progress:ch'+num, false);
    progressCache[num] = res ? JSON.parse(res.value) : {};
  }catch(e){ progressCache[num] = {}; }
  return progressCache[num];
}
async function saveChapterProgress(num, data){
  progressCache[num] = data;
  try{ await window.storage.set('htrab-progress:ch'+num, JSON.stringify(data), false); }
  catch(e){ console.error('progress save failed', e); }
}
function timeAgo(ts){
  const s = Math.floor((Date.now()-ts)/1000);
  if(s<60) return 'just now';
  if(s<3600) return Math.floor(s/60)+'m ago';
  if(s<86400) return Math.floor(s/3600)+'h ago';
  return Math.floor(s/86400)+'d ago';
}
function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function buildTOC(){
  tocEl.innerHTML = '';
  BOOK.chapters.forEach(ch => {
    const li = document.createElement('li');
    const btn = document.createElement('button');
    btn.innerHTML = `<span class="num">${String(ch.chapter).padStart(2,'0')}</span><span class="t">${ch.title.replace(/^Ch(apter)?\s*\d+[:\-–]?\s*/i,'')}</span>`;
    btn.dataset.chapter = ch.chapter;
    btn.addEventListener('click', () => renderChapter(ch.chapter));
    li.appendChild(btn);
    tocEl.appendChild(li);
  });
}

function highlightTOC(){
  document.querySelectorAll('.toc button').forEach(b => {
    b.classList.toggle('active', currentView.type==='chapter' && Number(b.dataset.chapter) === currentView.chapter);
  });
}

function starRating(r){
  if(!r) return '';
  const n = Math.round(parseFloat(r)/2);
  return '★'.repeat(n) + '☆'.repeat(5-n) + ` <span style="color:var(--ink-soft)">(${r}/10)</span>`;
}

async function renderChapter(num, opts){
  const ch = BOOK.chapters.find(c => c.chapter === num);
  if(!ch) return;
  currentView = { type:'chapter', chapter:num };
  const idx = BOOK.chapters.indexOf(ch);
  const prev = BOOK.chapters[idx-1];
  const next = BOOK.chapters[idx+1];
  const chapterRules = BOOK.rules_index.filter(r => r.chapter === num);

  mainEl.innerHTML = `
    <div class="card-header">
      <div class="meta-row">
        <span>Chapter ${ch.chapter}</span>
        <span>·</span>
        <span>${BOOK.title}</span>
        ${ch.rating ? `<span>·</span><span class="rating">${starRating(ch.rating)}</span>` : ''}
      </div>
      <h2>${ch.title}</h2>
      ${ch.summary ? `<p class="summary">${ch.summary}</p>` : ''}
      ${ch.tags && ch.tags.length ? `<div class="tag-row">${ch.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div>` : ''}
    </div>

    ${chapterRules.length ? `
    <div class="lens-bar">
      <span class="hint">Rule Lens:</span>
      <button class="lens-btn ${activeStage==='all'?'active':''}" data-stage="all">All</button>
      ${STAGES.map(s=>`<button class="lens-btn ${activeStage===s?'active':''}" data-stage="${s}">${s.split(': ')[1]}</button>`).join('')}
    </div>` : ''}

    <article>${ch.html}</article>

    <div class="workspace" id="workspace"></div>

    <div class="chapter-nav">
      ${prev ? `<a id="nav-prev">← Ch ${prev.chapter}</a>` : '<span></span>'}
      <span class="spacer"></span>
      ${next ? `<a id="nav-next">Ch ${next.chapter} →</a>` : '<span></span>'}
    </div>
  `;
  if(prev) document.getElementById('nav-prev').addEventListener('click', ()=>renderChapter(prev.chapter));
  if(next) document.getElementById('nav-next').addEventListener('click', ()=>renderChapter(next.chapter));

  mainEl.querySelectorAll('.lens-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      activeStage = btn.dataset.stage;
      mainEl.querySelectorAll('.lens-btn').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      applyLensFilter();
    });
  });

  tagRuleCallouts();
  applyLensFilter();
  await renderWorkspace(ch, chapterRules);

  highlightTOC();
  if(!opts || !opts.keepScroll) window.scrollTo(0,0);
  mermaid.run({ querySelector: '.mermaid' });
}

/* ---------- Rule Lens: tag & filter callouts by stage ---------- */
function tagRuleCallouts(){
  mainEl.querySelectorAll('article .callout').forEach(el => {
    const titleEl = el.querySelector('.callout-title');
    if(!titleEl) return;
    const m = titleEl.textContent.match(/Rule\s+(\d+)/i);
    if(!m) return;
    const rule = BOOK.rules_index.find(r => r.num === Number(m[1]));
    if(!rule) return;
    el.dataset.stage = rule.stage;
    el.classList.add('stage-'+stageNum(rule.stage));
  });
}
function applyLensFilter(){
  mainEl.querySelectorAll('article .callout').forEach(el => {
    el.classList.remove('lens-dim','lens-hit');
    if(activeStage === 'all' || !el.dataset.stage) return;
    if(el.dataset.stage === activeStage) el.classList.add('lens-hit');
    else el.classList.add('lens-dim');
  });
}

/* ---------- Workspace: predict, reveal, rate ---------- */
async function renderWorkspace(ch, chapterRules){
  const wsEl = document.getElementById('workspace');
  if(!wsEl) return;
  const saved = await loadChapterProgress(ch.chapter);

  const answerHtml = chapterRules.length
    ? chapterRules.map(r => `
        <div class="answer-rule">
          <span class="rn">Rule ${r.num} · ${r.stage}</span>
          <p class="rt">${r.title}</p>
          <p class="rd">${r.desc}</p>
        </div>`).join('')
    : `<div class="answer-rule"><p class="rd">${ch.summary || 'This chapter sets up the rules that follow — no numbered rule of its own yet.'}</p></div>`;

  wsEl.innerHTML = `
    <div class="workspace-head">
      <span class="workspace-icon">⚡</span>
      <h3>Test Yourself — Chapter ${ch.chapter}</h3>
    </div>
    <p class="workspace-intro">Adler's own acid tests: can you translate it, and can you exemplify it? Try both before you look.</p>

    <div class="predict-block">
      <label>Translate this chapter's core idea into your own words</label>
      <textarea data-field="translate" placeholder="No jargon, no borrowed phrases — your own sentence.">${escapeHtml(saved.translate)}</textarea>
    </div>
    <div class="predict-block">
      <label>Give a real-world example of it in action</label>
      <textarea data-field="example" placeholder="A concrete case, real or imagined.">${escapeHtml(saved.example)}</textarea>
    </div>

    <button class="reveal-btn ${saved.revealed?'open':''}" id="ws-reveal">
      <span class="chev">&#9656;</span> <span class="reveal-label">${saved.revealed?'Hide the rule(s)':'Reveal the rule(s)'}</span>
    </button>

    <div class="answer-outer ${saved.revealed?'open':''}" id="ws-answer-outer">
      <div class="answer-inner"><div class="answer-body">${answerHtml}</div></div>
    </div>

    <div class="rate-row">
      <span class="rlabel">How'd you do?</span>
      <button class="rate-btn ${saved.rating===1?'active':''}" data-v="1">1 · Forgot</button>
      <button class="rate-btn ${saved.rating===2?'active':''}" data-v="2">2 · Unsure</button>
      <button class="rate-btn ${saved.rating===3?'active':''}" data-v="3">3 · Close</button>
      <button class="rate-btn ${saved.rating===4?'active':''}" data-v="4">4 · Got it</button>
      <span class="rated-at" id="ws-rated-at">${saved.ratedAt ? 'rated ' + timeAgo(saved.ratedAt) : ''}</span>
    </div>
  `;

  wsEl.querySelectorAll('textarea').forEach(ta => {
    let t;
    ta.addEventListener('input', () => {
      clearTimeout(t);
      t = setTimeout(async () => {
        const cur = await loadChapterProgress(ch.chapter);
        cur[ta.dataset.field] = ta.value;
        await saveChapterProgress(ch.chapter, cur);
      }, 400);
    });
  });

  const revealBtn = document.getElementById('ws-reveal');
  revealBtn.addEventListener('click', async () => {
    const outer = document.getElementById('ws-answer-outer');
    const isOpen = outer.classList.toggle('open');
    revealBtn.classList.toggle('open', isOpen);
    revealBtn.querySelector('.reveal-label').textContent = isOpen ? 'Hide the rule(s)' : 'Reveal the rule(s)';
    const cur = await loadChapterProgress(ch.chapter);
    cur.revealed = isOpen;
    await saveChapterProgress(ch.chapter, cur);
  });

  wsEl.querySelectorAll('.rate-btn').forEach(rb => {
    rb.addEventListener('click', async () => {
      const v = Number(rb.dataset.v);
      const cur = await loadChapterProgress(ch.chapter);
      cur.rating = v;
      cur.ratedAt = Date.now();
      await saveChapterProgress(ch.chapter, cur);
      wsEl.querySelectorAll('.rate-btn').forEach(b=>b.classList.remove('active'));
      rb.classList.add('active');
      document.getElementById('ws-rated-at').textContent = 'rated just now';
      renderDailyReview();
    });
  });
}

function renderRulesIndex(){
  currentView = { type:'rules' };
  const stages = {};
  BOOK.rules_index.forEach(r => {
    stages[r.stage] = stages[r.stage] || [];
    stages[r.stage].push(r);
  });
  let html = `
    <div class="rules-page">
      <h2 class="page-title">The Rules of Analytical Reading</h2>
      <p class="page-sub">Synthesized across all ${BOOK.chapters.length} chapters — every numbered rule Adler & Van Doren give, gathered in one place, in the order you apply them.</p>
      <div class="lens-bar">
        <span class="hint">Rule Lens:</span>
        <button class="lens-btn ${activeStage==='all'?'active':''}" data-stage="all">All</button>
        ${STAGES.map(s=>`<button class="lens-btn ${activeStage===s?'active':''}" data-stage="${s}">${s.split(': ')[1]}</button>`).join('')}
      </div>
  `;
  Object.entries(stages).forEach(([stage, rules]) => {
    html += `<div class="stage-group" data-stage="${stage}"><h3>${stage}</h3>`;
    rules.forEach(r => {
      html += `
        <div class="rule-card" data-chapter="${r.chapter}">
          <div class="rule-num">${String(r.num).padStart(2,'0')}</div>
          <div>
            <p class="rule-title">${r.title}</p>
            <p class="rule-desc">${r.desc}</p>
            <span class="rule-src">from Chapter ${r.chapter} →</span>
          </div>
        </div>`;
    });
    html += `</div>`;
  });
  html += `</div>`;
  mainEl.innerHTML = html;
  document.querySelectorAll('.rule-card').forEach(el => {
    el.addEventListener('click', () => renderChapter(Number(el.dataset.chapter)));
  });
  mainEl.querySelectorAll('.lens-bar .lens-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      activeStage = btn.dataset.stage;
      mainEl.querySelectorAll('.lens-bar .lens-btn').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      mainEl.querySelectorAll('.stage-group').forEach(g => {
        g.style.display = (activeStage === 'all' || g.dataset.stage === activeStage) ? '' : 'none';
      });
    });
  });
  highlightTOC();
  window.scrollTo(0,0);
}

document.getElementById('rules-btn').addEventListener('click', renderRulesIndex);

// --- simple search across titles, tags, and stripped chapter text ---
const searchIndex = BOOK.chapters.map(ch => ({
  chapter: ch.chapter,
  title: ch.title,
  hay: (ch.title + ' ' + (ch.tags||[]).join(' ') + ' ' + ch.html.replace(/<[^>]+>/g,' ')).toLowerCase()
}));

const searchInput = document.getElementById('search');
const hitsEl = document.getElementById('hits');
searchInput.addEventListener('input', () => {
  const q = searchInput.value.trim().toLowerCase();
  if(!q){
    document.querySelectorAll('.toc li').forEach(li => li.style.display = '');
    hitsEl.textContent = '';
    return;
  }
  let count = 0;
  document.querySelectorAll('.toc li').forEach((li, i) => {
    const match = searchIndex[i].hay.includes(q);
    li.style.display = match ? '' : 'none';
    if(match) count++;
  });
  hitsEl.textContent = `${count} chapter${count===1?'':'s'} match`;
});

/* ---------- Daily Review drawer ---------- */
async function renderDailyReview(){
  const listEl = document.getElementById('review-list');
  const countEl = document.getElementById('review-count');
  const DAY = 24*60*60*1000;
  const due = [];
  for(const ch of BOOK.chapters){
    const p = await loadChapterProgress(ch.chapter);
    if(p.rating && p.rating <= 2 && p.ratedAt && (Date.now() - p.ratedAt) > DAY){
      due.push({ ch, p });
    }
  }
  countEl.textContent = due.length;
  listEl.innerHTML = due.length
    ? due.map(({ch,p}) => `
        <div class="review-item" data-chapter="${ch.chapter}">
          <span class="rev-ch">Chapter ${ch.chapter} · rated ${p.rating===1?'Forgot':'Unsure'}, ${timeAgo(p.ratedAt)}</span>
          ${ch.title.replace(/^Ch(apter)?\s*\d+[:\-–]?\s*/i,'')}
        </div>`).join('')
    : `<p class="review-empty">Nothing due — check back after 24h on anything you rated low.</p>`;
  listEl.querySelectorAll('.review-item').forEach(el => {
    el.addEventListener('click', () => {
      renderChapter(Number(el.dataset.chapter));
      setTimeout(() => document.getElementById('workspace')?.scrollIntoView({behavior:'smooth', block:'start'}), 60);
    });
  });
}
document.getElementById('review-toggle').addEventListener('click', () => {
  document.getElementById('review-list').classList.toggle('open');
});

/* ---------- Rule Graph modal ---------- */
const graphModal = document.getElementById('graph-modal');
let graphRendered = false;
window.jumpToRule = function(num){
  const rule = BOOK.rules_index.find(r => r.num === num);
  graphModal.classList.remove('open');
  if(rule) renderChapter(rule.chapter);
};
async function openGraph(){
  graphModal.classList.add('open');
  if(!graphRendered){
    graphRendered = true;
    const chain = BOOK.rules_index.map(r => `R${r.num}`).join(' --> ');
    const nodes = BOOK.rules_index.map(r => `    R${r.num}["Rule ${r.num}\\n${r.title}"]`).join('\n');
    const clicks = BOOK.rules_index.map(r => `    click R${r.num} call jumpToRule(${r.num})`).join('\n');
    const byStage = {1:[], 2:[], 3:[]};
    BOOK.rules_index.forEach(r => byStage[stageNum(r.stage)].push(`R${r.num}`));
    const graphDef = `flowchart TD
${nodes}
    ${chain}
    subgraph SG1["Stage 1 — Structure"]
      ${byStage[1].join('\n      ')}
    end
    subgraph SG2["Stage 2 — Interpretation"]
      ${byStage[2].join('\n      ')}
    end
    subgraph SG3["Stage 3 — Criticism"]
      ${byStage[3].join('\n      ')}
    end
    style SG1 fill:#f4efe2,stroke:#7c2e2a,color:#7c2e2a
    style SG2 fill:#f4efe2,stroke:#3a4a3a,color:#3a4a3a
    style SG3 fill:#f4efe2,stroke:#a3792f,color:#a3792f
${clicks}`;
    const target = document.getElementById('rule-graph-mermaid');
    target.removeAttribute('data-processed');
    target.innerHTML = graphDef;
    await mermaid.run({ nodes: [target] });
  }
}
document.getElementById('graph-btn').addEventListener('click', openGraph);
document.getElementById('graph-close').addEventListener('click', () => graphModal.classList.remove('open'));
graphModal.addEventListener('click', (e) => { if(e.target === graphModal) graphModal.classList.remove('open'); });

buildTOC();
renderChapter(BOOK.chapters[0].chapter);
renderDailyReview();
</script>
