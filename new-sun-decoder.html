<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Book of the New Sun – Reading Companion</title>
  <style>
    :root {
      --fuligin: #0a0a0c;
      --fuligin-2: #111114;
      --fuligin-3: #1a1a1f;
      --glass: rgba(255,255,255,0.035);
      --glass-border: rgba(255,255,255,0.08);
      --amber: #ffb020;
      --amber-glow: rgba(255,176,32,0.15);
      --cyan: #22d3ee;
      --cyan-dim: #0e7490;
      --text: #e8e4df;
      --text-muted: #9a948c;
      --text-dim: #6b655e;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--fuligin);
      color: var(--text);
      line-height: 1.65;
      min-height: 100vh;
      display: flex;
    }

    /* ========== SIDEBAR TIMELINE ========== */
    .sidebar {
      width: 240px;
      flex-shrink: 0;
      background: var(--fuligin-2);
      border-right: 1px solid var(--glass-border);
      height: 100vh;
      position: sticky;
      top: 0;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }

    .sidebar-brand {
      padding: 1.5rem 1.25rem 1.25rem;
      border-bottom: 1px solid var(--glass-border);
    }

    .sidebar-brand h1 {
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 2px;
      color: var(--amber);
      text-transform: uppercase;
    }

    .sidebar-brand .sub {
      font-size: 0.7rem;
      color: var(--text-dim);
      margin-top: 0.35rem;
      letter-spacing: 0.4px;
    }

    .timeline {
      flex: 1;
      padding: 1rem 0.75rem;
    }

    .timeline-item {
      display: flex;
      align-items: flex-start;
      gap: 0.7rem;
      padding: 0.7rem 0.85rem;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s ease;
      margin-bottom: 0.2rem;
      position: relative;
    }

    .timeline-item::before {
      content: '';
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--text-dim);
      margin-top: 0.35rem;
      flex-shrink: 0;
      transition: all 0.2s;
    }

    .timeline-item:hover {
      background: var(--glass);
    }

    .timeline-item.active {
      background: var(--amber-glow);
    }

    .timeline-item.active::before {
      background: var(--amber);
      box-shadow: 0 0 12px var(--amber);
    }

    .timeline-item .ch-meta {
      min-width: 0;
    }

    .timeline-item .ch-num {
      font-size: 0.68rem;
      font-weight: 600;
      color: var(--text-dim);
      letter-spacing: 0.5px;
    }

    .timeline-item.active .ch-num {
      color: var(--amber);
    }

    .timeline-item .ch-title {
      font-size: 0.82rem;
      color: var(--text-muted);
      line-height: 1.3;
      margin-top: 0.1rem;
    }

    .timeline-item.active .ch-title {
      color: var(--text);
      font-weight: 500;
    }

    /* ========== MAIN CONTENT ========== */
    .main {
      flex: 1;
      min-width: 0;
      padding: 2.25rem 2.75rem 4rem;
      max-width: 1080px;
    }

    .chapter-header {
      margin-bottom: 1.25rem;
    }

    .chapter-header h2 {
      font-family: 'Georgia', 'Palatino Linotype', serif;
      font-size: 2.35rem;
      font-weight: 400;
      color: var(--text);
      letter-spacing: 0.3px;
      margin-bottom: 0.4rem;
    }

    .chapter-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem 1.2rem;
      font-size: 0.78rem;
      color: var(--text-dim);
      letter-spacing: 0.4px;
    }

    .chapter-meta span {
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .chapter-meta .dot {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--text-dim);
    }

    /* Tags */
    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin-bottom: 2rem;
    }

    .tag {
      background: rgba(34,211,238,0.07);
      color: var(--cyan);
      border: 1px solid rgba(34,211,238,0.18);
      padding: 0.18rem 0.75rem;
      border-radius: 999px;
      font-size: 0.68rem;
      font-weight: 500;
      letter-spacing: 0.3px;
    }

    /* Section titles */
    .section {
      margin-bottom: 2.4rem;
    }

    .section-title {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 1.6px;
      text-transform: uppercase;
      color: var(--amber);
      margin-bottom: 0.95rem;
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .section-title::after {
      content: '';
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, var(--glass-border), transparent);
    }

    /* Summary */
    .summary-card {
      background: var(--glass);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      padding: 1.3rem 1.5rem;
      font-size: 0.95rem;
      color: var(--text-muted);
      line-height: 1.75;
    }

    /* Vocabulary – expandable */
    .vocab-list {
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
    }

    .vocab-item {
      background: var(--glass);
      border: 1px solid var(--glass-border);
      border-radius: 10px;
      overflow: hidden;
      transition: border-color 0.2s;
    }

    .vocab-item:hover,
    .vocab-item.open {
      border-color: rgba(255,176,32,0.35);
    }

    .vocab-header {
      display: flex;
      align-items: center;
      gap: 0.85rem;
      padding: 0.85rem 1.15rem;
      cursor: pointer;
      user-select: none;
    }

    .vocab-term {
      font-weight: 650;
      font-size: 0.95rem;
      color: var(--amber);
      letter-spacing: 0.2px;
      white-space: nowrap;
    }

    .vocab-preview {
      font-size: 0.84rem;
      color: var(--text-muted);
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .vocab-chevron {
      color: var(--text-dim);
      font-size: 0.7rem;
      transition: transform 0.25s, color 0.2s;
    }

    .vocab-item.open .vocab-chevron {
      transform: rotate(180deg);
      color: var(--amber);
    }

    .vocab-body {
      display: none;
      padding: 0 1.15rem 1.05rem;
      border-top: 1px solid var(--glass-border);
    }

    .vocab-item.open .vocab-body {
      display: block;
    }

    .vocab-etym {
      font-size: 0.8rem;
      color: var(--cyan);
      font-style: italic;
      margin: 0.7rem 0 0.35rem;
    }

    .vocab-excerpt {
      font-size: 0.84rem;
      color: var(--text-dim);
      font-style: italic;
      padding-left: 0.85rem;
      border-left: 2px solid var(--cyan-dim);
      margin-top: 0.35rem;
    }

    /* Critical Angles grid */
    .angle-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(255px, 1fr));
      gap: 0.85rem;
    }

    .angle-card {
      background: var(--glass);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      padding: 1.1rem 1.2rem;
      transition: border-color 0.2s, transform 0.2s;
    }

    .angle-card:hover {
      border-color: rgba(34,211,238,0.28);
      transform: translateY(-2px);
    }

    .angle-title {
      font-size: 0.8rem;
      font-weight: 650;
      color: var(--cyan);
      letter-spacing: 0.3px;
      margin-bottom: 0.4rem;
    }

    .angle-text {
      font-size: 0.86rem;
      color: var(--text-muted);
      line-height: 1.55;
    }

    /* Quotes */
    .quote {
      font-family: 'Georgia', 'Palatino Linotype', serif;
      font-style: italic;
      font-size: 1.02rem;
      color: var(--text);
      padding: 1rem 1.35rem;
      background: var(--glass);
      border-radius: 10px;
      margin-bottom: 0.65rem;
      border-left: 3px solid var(--amber);
      line-height: 1.6;
    }

    /* Evidence Ledger */
    .ledger {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
    }
    .ledger th {
      text-align: left;
      color: var(--text-dim);
      font-weight: 600;
      letter-spacing: 0.4px;
      border-bottom: 1px solid var(--glass-border);
      padding: 0.5rem 0.6rem;
      font-size: 0.72rem;
      text-transform: uppercase;
    }
    .ledger td {
      padding: 0.7rem 0.6rem;
      border-bottom: 1px solid var(--glass-border);
      vertical-align: top;
      color: var(--text-muted);
    }
    .ledger .theory { color: var(--text); font-weight: 500; }
    .conf-high { color: #34d399; }
    .conf-med { color: #fbbf24; }
    .conf-low { color: #f87171; }

    /* Connections */
    .connections-list {
      list-style: none;
    }

    .connections-list li {
      position: relative;
      padding: 0.45rem 0 0.45rem 1.4rem;
      font-size: 0.9rem;
      color: var(--text-muted);
      border-bottom: 1px solid var(--glass-border);
    }

    .connections-list li:last-child {
      border-bottom: none;
    }

    .connections-list li::before {
      content: '';
      position: absolute;
      left: 0.15rem;
      top: 0.85rem;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--cyan);
      box-shadow: 0 0 6px var(--cyan);
    }

    /* Questions */
    .question-list {
      list-style: none;
    }

    .question-list li {
      position: relative;
      padding: 0.5rem 0 0.5rem 1.6rem;
      font-size: 0.9rem;
      color: var(--text-muted);
      border-bottom: 1px solid var(--glass-border);
    }

    .question-list li:last-child {
      border-bottom: none;
    }

    .question-list li::before {
      content: '?';
      position: absolute;
      left: 0;
      top: 0.45rem;
      width: 1.15rem;
      height: 1.15rem;
      border-radius: 50%;
      background: rgba(255,176,32,0.12);
      color: var(--amber);
      font-size: 0.7rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      font-style: normal;
    }

    /* Personal Notes */
    .note-box {
      background: var(--glass);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      padding: 1.15rem 1.4rem;
      font-style: italic;
      font-size: 0.92rem;
      color: var(--text-muted);
      line-height: 1.7;
      border-left: 3px solid var(--cyan);
    }

    /* ========== RESPONSIVE ========== */
    @media (max-width: 860px) {
      body { flex-direction: column; }
      .sidebar {
        width: 100%;
        height: auto;
        position: relative;
        border-right: none;
        border-bottom: 1px solid var(--glass-border);
      }
      .timeline {
        display: flex;
        overflow-x: auto;
        gap: 0.35rem;
        padding: 0.75rem;
      }
      .timeline-item {
        flex-shrink: 0;
        min-width: 140px;
      }
      .main {
        padding: 1.5rem 1.15rem 3rem;
      }
      .chapter-header h2 {
        font-size: 1.7rem;
      }
      .angle-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

          "The trail of ink is endless. Is Severian's book also endless? (He writes it, casts it away, writes it again…)"
        ],
        personal_notes: "First read: a chapter about a library and a picture-cleaner. Second read: a chapter about the religion of memory. The library is a temple; the Book of Gold is a scripture; the librarians are priests. Severian is initiating himself into this religion by writing his own book. The picture-cleaner is a restorer of the dead—just as Severian will become a restorer of the dead with the Claw."
      }
    ];

    // ========== RENDER ==========
    function renderTimeline() {
      const nav = document.getElementById('timeline');
      nav.innerHTML = '';
      chapters.forEach((ch, idx) => {
        const item = document.createElement('div');
        item.className = 'timeline-item';
        item.dataset.index = idx;
        item.innerHTML = `
          <div class="ch-meta">
            <div class="ch-num">CH. ${ch.id}</div>
            <div class="ch-title">${ch.title}</div>
          </div>
        `;
        item.addEventListener('click', () => selectChapter(idx));
        nav.appendChild(item);
      });
      if (chapters.length) selectChapter(0);
    }

    function selectChapter(index) {
      document.querySelectorAll('.timeline-item').forEach((el, i) => {
        el.classList.toggle('active', i === index);
      });
      renderChapter(index);
      window.location.hash = `ch-${chapters[index].id}`;
    }

    function confClass(c) {
      if (c === 'high') return 'conf-high';
      if (c === 'med') return 'conf-med';
      return 'conf-low';
    }

    function confSymbol(c) {
      if (c === 'high') return '●';
      if (c === 'med') return '◐';
      return '○';
    }

    function renderChapter(index) {
      const ch = chapters[index];
      if (!ch) return;
      const container = document.getElementById('content');

      const tagsHtml = ch.tags.map(t => `<span class="tag">#${t}</span>`).join('');

      // Vocabulary – expandable
      let vocabHtml = '';
      if (ch.vocabulary?.length) {
        vocabHtml = `
          <div class="section">
            <div class="section-title">Vocabulary</div>
            <div class="vocab-list">
              ${ch.vocabulary.map((v, i) => `
                <div class="vocab-item" data-vocab="${i}">
                  <div class="vocab-header" onclick="toggleVocab(this)">
                    <span class="vocab-term">${v.term}</span>
                    <span class="vocab-preview">${v.definition}</span>
                    <span class="vocab-chevron">▼</span>
                  </div>
                  <div class="vocab-body">
                    <div class="vocab-etym">${v.etymology || '—'}</div>
                    <div class="vocab-excerpt">${v.excerpt}</div>
                  </div>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      }

      // Critical Angles
      let anglesHtml = '';
      if (ch.critical_angles?.length) {
        anglesHtml = `
          <div class="section">
            <div class="section-title">Critical Angles</div>
            <div class="angle-grid">
              ${ch.critical_angles.map(a => `
                <div class="angle-card">
                  <div class="angle-title">${a.title}</div>
                  <div class="angle-text">${a.text}</div>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      }

      // Evidence Ledger
      let ledgerHtml = '';
      if (ch.ledger?.length) {
        ledgerHtml = `
          <div class="section">
            <div class="section-title">Evidence Ledger</div>
            <table class="ledger">
              <thead>
                <tr>
                  <th>Theory</th>
                  <th>Evidence for</th>
                  <th>Evidence against</th>
                  <th>Conf.</th>
                </tr>
              </thead>
              <tbody>
                ${ch.ledger.map(row => `
                  <tr>
                    <td class="theory">${row.theory}</td>
                    <td>${row.for}</td>
                    <td>${row.against}</td>
                    <td class="${confClass(row.conf)}">${confSymbol(row.conf)}</td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        `;
      }

      // Quotes
      let quotesHtml = '';
      if (ch.quotes?.length) {
        quotesHtml = `
          <div class="section">
            <div class="section-title">Notable Quotes</div>
            ${ch.quotes.map(q => `<div class="quote">${q}</div>`).join('')}
          </div>
        `;
      }

      // Connections
      let connectionsHtml = '';
      if (ch.connections?.length) {
        connectionsHtml = `
          <div class="section">
            <div class="section-title">Connections</div>
            <ul class="connections-list">
              ${ch.connections.map(c => `<li>${c}</li>`).join('')}
            </ul>
          </div>
        `;
      }

      // Questions
      let questionsHtml = '';
      if (ch.questions?.length) {
        questionsHtml = `
          <div class="section">
            <div class="section-title">Questions for Reread</div>
            <ul class="question-list">
              ${ch.questions.map(q => `<li>${q}</li>`).join('')}
            </ul>
          </div>
        `;
      }

      // Personal Notes
      let notesHtml = '';
      if (ch.personal_notes) {
        notesHtml = `
          <div class="section">
            <div class="section-title">Personal Notes</div>
            <div class="note-box">${ch.personal_notes}</div>
          </div>
        `;
      }

      container.innerHTML = `
        <div class="chapter-header">
          <h2>${ch.title}</h2>
          <div class="chapter-meta">
            <span>${ch.book}</span>
            <span><span class="dot"></span> Part ${ch.part}</span>
            <span><span class="dot"></span> Chapter ${ch.id}</span>
          </div>
        </div>
        <div class="tags">${tagsHtml}</div>
        <div class="section">
          <div class="section-title">Summary</div>
          <div class="summary-card">${ch.summary}</div>
        </div>
        ${vocabHtml}
        ${anglesHtml}
        ${ledgerHtml}
        ${quotesHtml}
        ${connectionsHtml}
        ${questionsHtml}
        ${notesHtml}
      `;
    }

    function toggleVocab(header) {
      const item = header.closest('.vocab-item');
      item.classList.toggle('open');
    }

    // Init
    renderTimeline();
    window.addEventListener('load', () => {
      const hash = window.location.hash;
      if (hash.startsWith('#ch-')) {
        const id = parseInt(hash.replace('#ch-', ''), 10);
        const idx = chapters.findIndex(c => c.id === id);
        if (idx >= 0) selectChapter(idx);
      }
    });
  </script>
</body>
</html>
