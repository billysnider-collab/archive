    }

    }

    .app {

      margin: 0 auto;
      width: 100%;
      padding: 1rem;

      margin-bottom: 1.5rem;
    }

      font-size: 1.8rem;

    .header h1 small {
      font-size: 1rem;
      font-weight: 300;
      letter-spacing: 2px;
      color: #6a5e4e;
      margin-left: 1rem;
    }
    .header .sub {
      color: #6a5e4e;
      font-size: 0.85rem;
      letter-spacing: 2px;
    }

    .chapter-nav {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem 1rem;
      padding: 0.5rem 0 1rem 0;
      border-bottom: 1px solid #1f1b17;
      margin-bottom: 1.5rem;
    }
    .chapter-nav button {
      background: transparent;
      border: 1px solid #3a322c;
      color: #b8a78b;
      padding: 0.4rem 1.2rem;
      font-size: 0.9rem;
      font-family: inherit;
      cursor: pointer;
      border-radius: 20px;
      transition: all 0.2s ease;
      letter-spacing: 0.5px;
    }

      background: #2a2420;
      border-color: #6a5e4e;
      color: #e6d5b3;
    }

      background: #3a322c;
      border-color: #b8a78b;
      color: #f0e6d8;
      box-shadow: 0 0 12px rgba(180, 140, 100, 0.15);

      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 2rem;
    }

      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: baseline;
      border-bottom: 1px solid #2a2622;
      padding-bottom: 0.5rem;
      margin-bottom: 0.5rem;

      font-size: 1.8rem;
      font-weight: 300;
      color: #e6d5b3;
      letter-spacing: 1px;

      font-size: 0.85rem;
      letter-spacing: 1px;
    }

      gap: 0.4rem 0.8rem;
      margin-bottom: 1rem;
    }

      background: #1f1b17;
      color: #b8a78b;
      padding: 0.1rem 0.8rem;
      border-radius: 12px;
      font-size: 0.75rem;
      letter-spacing: 0.5px;
      border: 1px solid #2a2622;

      padding: 1rem 1.5rem;
      margin-bottom: 1.5rem;
      border-radius: 0 6px 6px 0;

      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #b8a78b;

      font-size: 0.95rem;
    }

      padding-left: 1.5rem;
      margin: 0.5rem 0;
    }
    .section li {
      margin-bottom: 0.3rem;
    }
    .section .quote {
      font-style: italic;
      color: #c9b69a;
      padding: 0.5rem 1rem;
      background: #1a1714;
      border-radius: 4px;
      margin: 0.5rem 0;
      border-left: 3px solid #6a5e4e;
    }
    .section .quote::before {
      content: "“";
      color: #6a5e4e;
      font-size: 1.4rem;
      margin-right: 0.2rem;
    }
    .section .quote::after {
      content: "”";
      color: #6a5e4e;
      font-size: 1.4rem;
      margin-left: 0.2rem;
    }

      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
    }
    .vocab-table th {
      text-align: left;
      color: #b8a78b;
      font-weight: 500;
      letter-spacing: 1px;
      border-bottom: 1px solid #2a2622;
      padding: 0.4rem 0.5rem;

    .vocab-table td {

      border-bottom: 1px solid #1f1b17;
      vertical-align: top;
    }
    .vocab-table .term {
      color: #e6d5b3;
      font-weight: 500;
      white-space: nowrap;
    }
    .vocab-table .def {
      color: #b8a78b;
    }
    .vocab-table .excerpt {
      color: #a0907a;
      font-style: italic;
      font-size: 0.85rem;
    }

    .angle-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 1rem;
      margin-top: 0.5rem;
    }
    .angle-card {
      background: #1a1714;
      border: 1px solid #2a2622;
      border-radius: 6px;
      padding: 0.8rem 1rem;

    }
    .angle-card:hover {
      background: #24201c;
    }
    .angle-card .angle-title {
      font-weight: 600;
      color: #e6d5b3;
      margin-bottom: 0.3rem;
      font-size: 0.9rem;
    }
    .angle-card .angle-text {
      font-size: 0.85rem;

      padding: 1rem;
      font-style: italic;

      }
      .angle-grid {
        grid-template-columns: 1fr;
      }
      .chapter-header h2 {
        font-size: 1.4rem;
      }
    }

          "Chapter 1 → The coin from Vodalus is finally examined.",
          "Chapter 2 → The mausoleum and the funeral bronze are revisited.",
          "The Flying Ship → The ship of Tzadkiel in The Urth of the New Sun.",
          "The Woman's Face → The Autarch as Legion; also Valeria, Thecla.",
          "The Charm → 'Where I put you, there you lie...' This is a burial charm. Severian is burying his past self.",
          "The New Clients → The prisoners arrive; Severian's hope that they are Vodalarii is crushed."
        ],
        questions: [
          "Why does Severian think the coin's woman's face is the Autarch? Is the Autarch a woman?",
          "The coin has the same flying ship as his mausoleum blazon. Is this coincidence, or is the mausoleum his tomb? Is he burying his own future?",
          "Severian says he 'forgets nothing,' yet he doubts his memories. Is this a contradiction, or is he choosing which memories to trust?",
          "The charm he recites—is it effective? Does the coin stay hidden?",
          "Why does Severian feel relief when he realizes the prisoners aren't Vodalarii? Is he disappointed, or is he protecting his fantasy?"
        ],
        personal_notes: "First read: a chapter about guild politics and a coin. Second read: a chapter about the nature of reality, memory, and the self. The coin is not just a coin—it's the symbol of his divided loyalty. The woman's face on it is the Autarch, but also Thecla, also Valeria, also himself. He is burying his past in the mausoleum that contains his own corpse. The crisis of memory is the crisis of the entire narrative."
      }
    ];

    // ----- RENDER FUNCTIONS -----
    function renderNav() {
      const nav = document.getElementById('chapterNav');
      nav.innerHTML = '';
      chapters.forEach((ch, idx) => {
        const btn = document.createElement('button');
        btn.textContent = `Ch. ${ch.id} · ${ch.title}`;
        btn.dataset.index = idx;
        btn.addEventListener('click', () => selectChapter(idx));
        nav.appendChild(btn);
      });
      // Activate first chapter
      if (chapters.length > 0) {
        selectChapter(0);
      }
    }

    function selectChapter(index) {
      // Update nav buttons
      const buttons = document.querySelectorAll('.chapter-nav button');
      buttons.forEach((btn, i) => {
        btn.classList.toggle('active', i === index);
      });
      renderChapter(index);
      // Save to URL hash for bookmarking
      window.location.hash = `ch-${chapters[index].id}`;
    }

    function renderChapter(index) {
      const ch = chapters[index];
      const container = document.getElementById('content');
      if (!ch) return;

      // Build tags HTML
      const tagsHtml = ch.tags.map(t => `<span class="tag">#${t}</span>`).join('');

      // Build vocabulary table
      let vocabHtml = '';
      if (ch.vocabulary && ch.vocabulary.length) {
        vocabHtml = `<div class="section"><h3>📖 Vocabulary</h3><table class="vocab-table"><thead><tr><th>Term</th><th>Definition</th><th>Excerpt</th></tr></thead><tbody>`;
        ch.vocabulary.forEach(v => {
          vocabHtml += `<tr><td class="term">${v.term}</td><td class="def">${v.definition}</td><td class="excerpt">${v.excerpt}</td></tr>`;
        });
        vocabHtml += `</tbody></table></div>`;
      }

      // Build critical angles
      let anglesHtml = '';
      if (ch.critical_angles && ch.critical_angles.length) {
        anglesHtml = `<div class="section"><h3>🔍 Critical Angles</h3><div class="angle-grid">`;
        ch.critical_angles.forEach(a => {
          anglesHtml += `<div class="angle-card"><div class="angle-title">${a.title}</div><div class="angle-text">${a.text}</div></div>`;
        });
        anglesHtml += `</div></div>`;
      }

      // Build quotes
      let quotesHtml = '';
      if (ch.quotes && ch.quotes.length) {
        quotesHtml = `<div class="section"><h3>📌 Notable Quotes</h3>`;
        ch.quotes.forEach(q => {
          quotesHtml += `<div class="quote">${q}</div>`;
        });
        quotesHtml += `</div>`;
      }

      // Build connections
      let connectionsHtml = '';
      if (ch.connections && ch.connections.length) {
        connectionsHtml = `<div class="section"><h3>🔗 Connections</h3><ul>`;
        ch.connections.forEach(c => {
          connectionsHtml += `<li>${c}</li>`;
        });
        connectionsHtml += `</ul></div>`;
      }

      // Build questions
      let questionsHtml = '';
      if (ch.questions && ch.questions.length) {
        questionsHtml = `<div class="section"><h3>🤔 Questions for Reread</h3><ul class="question-list">`;
        ch.questions.forEach(q => {
          questionsHtml += `<li>${q}</li>`;
        });
        questionsHtml += `</ul></div>`;
      }

      // Personal notes
      let notesHtml = '';
      if (ch.personal_notes) {
        notesHtml = `<div class="section"><h3>📝 Personal Notes</h3><div class="note-box">${ch.personal_notes}</div></div>`;
      }

      // Assemble full content
      container.innerHTML = `
        <div class="chapter-header">
          <h2>${ch.title}</h2>
          <div class="meta">
            <span>${ch.book}</span>
            <span>Part ${ch.part}</span>
            <span>Chapter ${ch.id}</span>
          </div>
        </div>
        <div class="tags">${tagsHtml}</div>
        <div class="section"><h3>📖 Summary</h3><p>${ch.summary}</p></div>
        ${vocabHtml}
        ${anglesHtml}
        ${quotesHtml}
        ${connectionsHtml}
        ${questionsHtml}
        ${notesHtml}
      `;
    }

    // ----- INITIALIZATION -----
    renderNav();

    // Handle hash on load (e.g., #ch-2)
    window.addEventListener('load', () => {
      const hash = window.location.hash;
      if (hash.startsWith('#ch-')) {
        const id = parseInt(hash.replace('#ch-', ''), 10);
        const idx = chapters.findIndex(c => c.id === id);
        if (idx >= 0) {
          selectChapter(idx);
        }
      }
    });
  </script>
</body>
</html>
